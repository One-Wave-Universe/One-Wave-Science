name: TEMP Six Gate Canon Sync

on:
  push:
    branches:
      - canon/complete-node-graph-2026-09-12

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canon/complete-node-graph-2026-09-12
      - name: Synchronize six-gate canon
        run: python3 scripts/six_gate_canon_lock.py --write
      - name: Commit AI ingestion correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AI_CANONICAL_START_HERE.md
          if git diff --cached --quiet; then
            echo 'No AI canon changes.'
            exit 0
          fi
          git commit -m 'canon: synchronize AI six-gate architecture'
          git push origin HEAD:canon/complete-node-graph-2026-09-12
