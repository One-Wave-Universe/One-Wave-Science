name: tmp-vbb-diode-newton-limiter
on:
  push:
    branches: [virtual-breadboard-ngspice-crosscheck]
    paths:
      - '.github/workflows/tmp-vbb-diode-newton-limiter.yml'
      - '.github/scripts/fix_vbb_diode_newton_limiter.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: virtual-breadboard-ngspice-crosscheck
      - run: python .github/scripts/fix_vbb_diode_newton_limiter.py
      - run: |
          git config user.name "Mark Wright"
          git config user.email "markluvsoliviaduh@gmail.com"
          git add Virtual_Breadboard/js/circuit.js
          git commit -m "Virtual Breadboard: fix continuous diode Newton limiting"
          git push origin HEAD:virtual-breadboard-ngspice-crosscheck
