name: tmp-vbb-mosfet-model-cards
on:
  push:
    branches: [virtual-breadboard-mosfet-model-cards]
    paths:
      - '.github/workflows/tmp-vbb-mosfet-model-cards.yml'
      - '.github/scripts/patch_vbb_mosfet_model_cards.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: virtual-breadboard-mosfet-model-cards
      - run: python .github/scripts/patch_vbb_mosfet_model_cards.py
      - run: |
          git config user.name "Mark Wright"
          git config user.email "markluvsoliviaduh@gmail.com"
          git add Virtual_Breadboard/js/circuit.js Virtual_Breadboard/js/ac-analysis.js
          git commit -m "Virtual Breadboard: add MOSFET model cards"
          git push origin HEAD:virtual-breadboard-mosfet-model-cards
