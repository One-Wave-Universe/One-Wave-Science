name: Agent Host MVP

on:
  pull_request:
    paths:
      - 'One_Wave_Bench/agent_host/**'
      - '.github/workflows/agent-host-mvp.yml'
  push:
    branches:
      - 'agent-host/mvp-shared-loop'
    paths:
      - 'One_Wave_Bench/agent_host/**'
      - '.github/workflows/agent-host-mvp.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q One_Wave_Bench/agent_host/test_shared_loop_mvp.py
