name: Gravity proof bench

on:
  push:
    paths:
      - 'One_Wave_Bench/gravity/**'
      - 'Internal_Proofs/08_Finite_Slope_Sieve_Boundary_and_Assimilation_Proof_Target.md'
      - 'Internal_Proofs/09_Gradient_Curvature_Green_Function_Gravity_Bridge.md'
      - 'Internal_Proofs/10_Exact_Equilateral_Three_Body_Closure_for_Gradient_Curvature_Law.md'
      - 'Internal_Proofs/11_Source_Response_Reciprocity_and_Universal_Fall_Coupling_Theorem.md'
      - 'Internal_Proofs/12_Finite_Uniform_Sphere_Smooth_Core_and_Exterior_Form_Factor.md'
      - '.github/workflows/gravity-proof-bench.yml'
  pull_request:
    paths:
      - 'One_Wave_Bench/gravity/**'
      - 'Internal_Proofs/08_Finite_Slope_Sieve_Boundary_and_Assimilation_Proof_Target.md'
      - 'Internal_Proofs/09_Gradient_Curvature_Green_Function_Gravity_Bridge.md'
      - 'Internal_Proofs/10_Exact_Equilateral_Three_Body_Closure_for_Gradient_Curvature_Law.md'
      - 'Internal_Proofs/11_Source_Response_Reciprocity_and_Universal_Fall_Coupling_Theorem.md'
      - 'Internal_Proofs/12_Finite_Uniform_Sphere_Smooth_Core_and_Exterior_Form_Factor.md'
      - '.github/workflows/gravity-proof-bench.yml'

jobs:
  gravity-proof-benches:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run all gravity proof bench tests
        working-directory: One_Wave_Bench/gravity
        run: python -m unittest discover -v

      - name: Emit finite-slope sieve receipt
        run: python One_Wave_Bench/gravity/finite_slope_sieve_bench.py --json

      - name: Emit gradient-curvature slope receipt
        run: python One_Wave_Bench/gravity/gradient_curvature_slope_bench.py --json

      - name: Emit exact equilateral three-body receipt
        run: python One_Wave_Bench/gravity/gradient_curvature_three_body_bench.py --json

      - name: Emit finite uniform-sphere receipt
        run: python One_Wave_Bench/gravity/finite_uniform_sphere_bench.py --json
