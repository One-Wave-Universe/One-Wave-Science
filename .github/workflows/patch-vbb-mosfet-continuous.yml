name: Patch VBB Continuous MOSFET

on:
  push:
    branches: [virtual-breadboard-mosfet-continuous]
    paths:
      - '.github/workflows/patch-vbb-mosfet-continuous.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: virtual-breadboard-mosfet-continuous
      - name: Patch continuous MOSFET channel model
        env:
          PATCH_B64: 
        run: python -c "import os,base64; exec(base64.b64decode(os.environ['PATCH_B64']))"
      - name: Commit solver patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Virtual_Breadboard/js/circuit.js
          git commit -m "Virtual Breadboard: add continuous MOSFET channel mode"
          git push
