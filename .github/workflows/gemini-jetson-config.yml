name: Gemini Bridge Validate

on:
  push:
    paths:
      - 'One_Wave_Bench/bridges/scripts/gemini_min.sh'
      - 'One_Wave_Bench/bridges/scripts/gemini_hive.sh'
      - 'One_Wave_Bench/bridges/scripts/install_gemini_jetson.sh'
      - 'One_Wave_Bench/bridges/docs/JETSON_GEMINI_MINIMAL.md'
      - '.gemini/settings.json'
      - '.geminiignore'
      - '.github/workflows/gemini-jetson-config.yml'
  pull_request:
    paths:
      - 'One_Wave_Bench/bridges/scripts/gemini_min.sh'
      - 'One_Wave_Bench/bridges/scripts/gemini_hive.sh'
      - 'One_Wave_Bench/bridges/scripts/install_gemini_jetson.sh'
      - 'One_Wave_Bench/bridges/docs/JETSON_GEMINI_MINIMAL.md'
      - '.gemini/settings.json'
      - '.geminiignore'
      - '.github/workflows/gemini-jetson-config.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          bash -n One_Wave_Bench/bridges/scripts/install_gemini_jetson.sh
          bash -n One_Wave_Bench/bridges/scripts/gemini_min.sh
          bash -n One_Wave_Bench/bridges/scripts/gemini_hive.sh
      - name: Settings bounds
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('.gemini/settings.json').read_text())
          assert data['model']['name']=='flash-lite'
          assert data['model']['maxSessionTurns']<=6
          assert data['model']['compressionThreshold']<=0.25
          assert data['experimental']['autoMemory'] is False
          assert data['privacy']['usageStatisticsEnabled'] is False
          assert data['security']['disableYoloMode'] is True
          print('settings: PASS')
          PY
      - name: Wrapper smoke test
        run: |
          mkdir -p .ci-bin
          cat > .ci-bin/gemini <<'SH'
          #!/usr/bin/env bash
          printf '%s\n' "$@"
          SH
          chmod +x .ci-bin/gemini
          PATH="$PWD/.ci-bin:$PATH" bash One_Wave_Bench/bridges/scripts/gemini_min.sh ask "CI bounded smoke" > /tmp/gemini-args.txt
          grep -Fx -- '--extensions' /tmp/gemini-args.txt
          grep -Fx -- 'none' /tmp/gemini-args.txt
