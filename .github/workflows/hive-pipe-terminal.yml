name: Hive Pipe Terminal

on:
  push:
    paths:
      - 'hive-pipe/**'
      - 'AI_BRIDGE_START_HERE.md'
      - '.github/workflows/hive-pipe-terminal.yml'
  pull_request:
    paths:
      - 'hive-pipe/**'
      - 'AI_BRIDGE_START_HERE.md'
      - '.github/workflows/hive-pipe-terminal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          bash -n hive-pipe/agent.sh
          bash -n hive-pipe/install_gateway.sh
          bash -n hive-pipe/create_client_token.sh
          bash -n hive-pipe/install_chatgpt_terminal_pull.sh
          bash -n hive-pipe/bootstrap_chatgpt_terminal_pull.sh
      - name: Python syntax
        run: |
          python3 -m py_compile \
            hive-pipe/gateway.py \
            hive-pipe/mudl.py \
            hive-pipe/terminal_parser.py \
            hive-pipe/chatgpt_terminal_pull.py \
            hive-pipe/bridge_doctor.py \
            hive-pipe/deepseek_bridge.py \
            hive-pipe/deepseek_web_bridge.py
      - name: Hive Pipe tests
        run: python3 -m unittest discover -s hive-pipe -p 'test_*.py' -v
      - name: Unified bridge contracts
        run: python3 hive-pipe/bridge_doctor.py --profile ci
      - name: Perplexity first-class client config
        run: |
          grep -q 'codex claude gemini perplexity' hive-pipe/install_gateway.sh
          grep -q 'X-API-Key' hive-pipe/gateway.py
          grep -q 'PERPLEXITY_SHELL_OK' hive-pipe/test_terminal_parser.py
