name: Bridge Core Validate

on:
  push:
    paths:
      - 'One_Wave_Bench/bridges/hive-pipe/**'
      - 'One_Wave_Bench/bridges/docs/**'
      - '.github/workflows/hive-pipe-terminal.yml'
  pull_request:
    paths:
      - 'One_Wave_Bench/bridges/hive-pipe/**'
      - 'One_Wave_Bench/bridges/docs/**'
      - '.github/workflows/hive-pipe-terminal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          set -euo pipefail
          for f in One_Wave_Bench/bridges/hive-pipe/*.sh; do bash -n "$f"; done
      - name: Python syntax
        run: python3 -m py_compile One_Wave_Bench/bridges/hive-pipe/*.py
      - name: Hive Pipe tests
        run: python3 -m unittest discover -s One_Wave_Bench/bridges/hive-pipe -p 'test_*.py' -v
      - name: Bridge doctor
        run: python3 One_Wave_Bench/bridges/hive-pipe/bridge_doctor.py --profile ci
