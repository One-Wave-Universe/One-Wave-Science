name: tmp-vbb-bjt-patch
on:
  push:
    branches: [virtual-breadboard-bjt-support]
    paths:
      - '.github/workflows/tmp-vbb-bjt-patch.yml'
      - '.github/scripts/patch_vbb_bjt.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: virtual-breadboard-bjt-support
      - run: python .github/scripts/patch_vbb_bjt.py
      - run: |
          git config user.name "Mark Wright"
          git config user.email "markluvsoliviaduh@gmail.com"
          git add Virtual_Breadboard/js/circuit.js Virtual_Breadboard/js/ac-analysis.js
          git commit -m "Virtual Breadboard: add continuous BJT model"
          git push origin HEAD:virtual-breadboard-bjt-support
