name: Patch VBB SPICE Tolerances

on:
  push:
    branches: [virtual-breadboard-spice-tolerances]
    paths:
      - '.github/workflows/patch-vbb-spice-tolerances.yml'
      - '.github/scripts/patch-vbb-spice-tolerances.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: virtual-breadboard-spice-tolerances
      - name: Patch SPICE-style tolerances
        run: python .github/scripts/patch-vbb-spice-tolerances.py
      - name: Commit solver patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Virtual_Breadboard/js/circuit.js
          git commit -m "Virtual Breadboard: add SPICE convergence tolerances"
          git push
