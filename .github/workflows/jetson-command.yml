name: Jetson Command Lane

on:
  workflow_dispatch:
    inputs:
      argv_json:
        description: 'Preferred argv JSON array'
        required: false
        default: ''
        type: string
      command:
        description: 'Fallback simple command parsed with shlex'
        required: false
        default: ''
        type: string
      cwd:
        description: 'Optional Jetson working directory'
        required: false
        default: '/home/Scales/One-Wave-Science'
        type: string
      timeout:
        description: 'Timeout seconds, capped by terminal parser'
        required: false
        default: '120'
        type: string
      gateway_url:
        description: 'Optional gateway URL; blank uses JETSON_GATEWAY_URL'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: jetson-command-lane
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REQUESTED_URL: ${{ inputs.gateway_url }}
      DEFAULT_URL: ${{ secrets.JETSON_GATEWAY_URL }}
      GATEWAY_TOKEN: ${{ secrets.JETSON_GATEWAY_TOKEN }}
      ARGV_JSON: ${{ inputs.argv_json }}
      COMMAND: ${{ inputs.command }}
      COMMAND_CWD: ${{ inputs.cwd }}
      COMMAND_TIMEOUT: ${{ inputs.timeout }}
    steps:
      - name: Send command through canonical Hive Pipe MCP route
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${REQUESTED_URL:-$DEFAULT_URL}" ]] || { echo "::error::Missing gateway URL"; exit 1; }
          [[ -n "${GATEWAY_TOKEN}" ]] || { echo "::error::Missing gateway token"; exit 1; }
          [[ -n "${ARGV_JSON}" || -n "${COMMAND}" ]] || { echo "::error::Missing command"; exit 1; }
          URL="${REQUESTED_URL:-$DEFAULT_URL}"
          export URL
          python3 - <<'PY'
          import json, os, shlex, sys, urllib.error, urllib.request
          raw=os.environ.get("ARGV_JSON","").strip()
          argv=json.loads(raw) if raw else shlex.split(os.environ.get("COMMAND",""))
          if not isinstance(argv,list) or not argv or not all(isinstance(x,str) and x for x in argv):
              raise SystemExit("command must resolve to a non-empty argv list")
          args={"argv":argv,"timeout":int(os.environ["COMMAND_TIMEOUT"])}
          if os.environ.get("COMMAND_CWD"):
              args["cwd"]=os.environ["COMMAND_CWD"]
          payload={"jsonrpc": "2.0", "id": 1, "method": "tools/call", "params": {"name": "terminal_run", "arguments": args}}
          req=urllib.request.Request(
              os.environ["URL"].rstrip("/") + "/mcp",
              data=json.dumps(payload).encode(),
              headers={"Authorization":"Bearer "+os.environ["GATEWAY_TOKEN"],"Content-Type":"application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req,timeout=int(os.environ["COMMAND_TIMEOUT"])+15) as response:
                  envelope=json.load(response)
          except urllib.error.HTTPError as exc:
              sys.stderr.write(exc.read().decode("utf-8",errors="replace"))
              raise SystemExit(1)
          if "error" in envelope:
              print(json.dumps(envelope["error"],indent=2),file=sys.stderr)
              raise SystemExit(1)
          result=envelope.get("result",{}).get("structuredContent",{})
          sys.stdout.write(result.get("stdout",""))
          sys.stderr.write(result.get("stderr",""))
          raise SystemExit(int(result.get("exit_code",0 if result.get("ok") else 1)))
          PY
