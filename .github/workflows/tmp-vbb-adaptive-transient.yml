name: tmp-vbb-adaptive-transient
on:
  push:
    branches: [virtual-breadboard-adaptive-transient]
    paths:
      - '.github/workflows/tmp-vbb-adaptive-transient.yml'
      - '.github/scripts/patch_vbb_adaptive_transient.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: virtual-breadboard-adaptive-transient
      - run: python .github/scripts/patch_vbb_adaptive_transient.py
      - run: |
          git config user.name "Mark Wright"
          git config user.email "markluvsoliviaduh@gmail.com"
          git add Virtual_Breadboard/js/spice-analysis.js
          git commit -m "Virtual Breadboard: add adaptive transient analysis"
          git push origin HEAD:virtual-breadboard-adaptive-transient
