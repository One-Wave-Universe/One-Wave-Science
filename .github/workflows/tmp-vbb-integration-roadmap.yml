name: tmp-vbb-integration-roadmap
on:
  push:
    branches: [virtual-breadboard-integration-methods]
    paths:
      - '.github/workflows/tmp-vbb-integration-roadmap.yml'
      - '.github/scripts/mark_vbb_integration_done.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: virtual-breadboard-integration-methods
      - run: python .github/scripts/mark_vbb_integration_done.py
      - run: |
          git config user.name "Mark Wright"
          git config user.email "markluvsoliviaduh@gmail.com"
          git add Virtual_Breadboard/SPICE_PARITY.md
          git commit -m "Virtual Breadboard: mark integration methods implemented"
          git push origin HEAD:virtual-breadboard-integration-methods
