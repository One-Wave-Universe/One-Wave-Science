name: tmp-vbb-bjt-limit
on:
  push:
    branches: [virtual-breadboard-bjt-support]
    paths:
      - '.github/workflows/tmp-vbb-bjt-limit.yml'
      - '.github/scripts/limit_vbb_bjt_newton.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: virtual-breadboard-bjt-support
      - run: python .github/scripts/limit_vbb_bjt_newton.py
      - run: |
          git config user.name "Mark Wright"
          git config user.email "markluvsoliviaduh@gmail.com"
          git add Virtual_Breadboard/js/circuit.js
          git commit -m "Virtual Breadboard: limit BJT Newton junction steps"
          git push origin HEAD:virtual-breadboard-bjt-support
