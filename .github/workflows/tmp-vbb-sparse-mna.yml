name: tmp-vbb-sparse-mna
on:
  push:
    branches: [virtual-breadboard-sparse-mna]
    paths:
      - '.github/workflows/tmp-vbb-sparse-mna.yml'
      - '.github/scripts/patch_vbb_sparse_mna.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: virtual-breadboard-sparse-mna
      - run: python .github/scripts/patch_vbb_sparse_mna.py
      - run: |
          git config user.name "Mark Wright"
          git config user.email "markluvsoliviaduh@gmail.com"
          git add Virtual_Breadboard/js/circuit.js
          git commit -m "Virtual Breadboard: add sparse MNA solver path"
          git push origin HEAD:virtual-breadboard-sparse-mna
