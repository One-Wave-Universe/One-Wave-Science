name: tmp-vbb-ac-ground-patch
on:
  push:
    branches: [virtual-breadboard-controlled-sources]
    paths:
      - '.github/workflows/tmp-vbb-ac-ground-patch.yml'
      - '.github/scripts/patch_vbb_ac_ground.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: virtual-breadboard-controlled-sources
      - run: python .github/scripts/patch_vbb_ac_ground.py
      - run: |
          git config user.name "Mark Wright"
          git config user.email "markluvsoliviaduh@gmail.com"
          git add Virtual_Breadboard/js/ac-analysis.js
          git commit -m "Virtual Breadboard: prefer explicit AC ground node"
          git push origin HEAD:virtual-breadboard-controlled-sources
