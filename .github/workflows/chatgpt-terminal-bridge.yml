name: ChatGPT Jetson Terminal Bridge

on:
  push:
    branches:
      - chatgpt-terminal
    paths:
      - .chatgpt-terminal/request.json

permissions:
  contents: write

concurrency:
  group: chatgpt-terminal-bridge
  cancel-in-progress: false

jobs:
  terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEFAULT_URL: ${{ secrets.JETSON_GATEWAY_URL }}
      GATEWAY_TOKEN: ${{ secrets.JETSON_GATEWAY_TOKEN }}

    steps:
      - name: Check out command branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-terminal
          fetch-depth: 1

      - name: Validate and run request through Hive Pipe MCP
        id: run
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          request_path = pathlib.Path('.chatgpt-terminal/request.json')
          result_path = pathlib.Path('.chatgpt-terminal/result.json')

          if not request_path.is_file():
              raise SystemExit('missing .chatgpt-terminal/request.json')
          if request_path.stat().st_size > 8192:
              raise SystemExit('request.json exceeds 8 KiB limit')

          request = json.loads(request_path.read_text(encoding='utf-8'))
          request_id = request.get('id')
          argv = request.get('argv')
          cwd = request.get('cwd', '/home/Scales/One-Wave-Science')
          timeout = request.get('timeout', 120)

          if not isinstance(request_id, str) or not request_id.strip() or len(request_id) > 128:
              raise SystemExit('id must be a non-empty string <= 128 characters')
          if not isinstance(argv, list) or not argv or not all(isinstance(x, str) and x for x in argv):
              raise SystemExit('argv must be a non-empty JSON array of non-empty strings')
          if len(argv) > 128 or sum(len(x) for x in argv) > 8192:
              raise SystemExit('argv exceeds bridge size limits')
          if not isinstance(cwd, str) or not cwd.startswith('/') or len(cwd) > 1024:
              raise SystemExit('cwd must be an absolute path <= 1024 characters')
          if not isinstance(timeout, int) or timeout < 1 or timeout > 300:
              raise SystemExit('timeout must be an integer from 1 to 300')

          url = os.environ.get('DEFAULT_URL', '').strip()
          token = os.environ.get('GATEWAY_TOKEN', '').strip()
          if not url:
              raise SystemExit('JETSON_GATEWAY_URL secret is not configured')
          if not token:
              raise SystemExit('JETSON_GATEWAY_TOKEN secret is not configured')

          payload = {
              'jsonrpc': '2.0',
              'id': 1,
              'method': 'tools/call',
              'params': {
                  'name': 'terminal_run',
                  'arguments': {
                      'argv': argv,
                      'cwd': cwd,
                      'timeout': timeout,
                  },
              },
          }

          envelope = None
          bridge_error = None
          try:
              req = urllib.request.Request(
                  url.rstrip('/') + '/mcp',
                  data=json.dumps(payload).encode('utf-8'),
                  headers={
                      'Authorization': 'Bearer ' + token,
                      'Content-Type': 'application/json',
                  },
                  method='POST',
              )
              with urllib.request.urlopen(req, timeout=timeout + 15) as response:
                  envelope = json.load(response)
          except urllib.error.HTTPError as exc:
              bridge_error = exc.read().decode('utf-8', errors='replace')
          except Exception as exc:
              bridge_error = f'{type(exc).__name__}: {exc}'

          result = {
              'id': request_id,
              'requested_at_commit': os.environ.get('GITHUB_SHA'),
              'completed_at': datetime.now(timezone.utc).isoformat(),
              'argv': argv,
              'cwd_requested': cwd,
              'timeout_requested': timeout,
          }

          if bridge_error is not None:
              result.update({
                  'ok': False,
                  'bridge_error': bridge_error,
                  'exit_code': None,
                  'stdout': '',
                  'stderr': '',
              })
          elif 'error' in envelope:
              result.update({
                  'ok': False,
                  'rpc_error': envelope['error'],
                  'exit_code': None,
                  'stdout': '',
                  'stderr': '',
              })
          else:
              tool_result = envelope.get('result', {})
              structured = tool_result.get('structuredContent', {})
              result.update({
                  'ok': bool(structured.get('ok', False)),
                  'exit_code': structured.get('exit_code'),
                  'stdout': structured.get('stdout', ''),
                  'stderr': structured.get('stderr', ''),
                  'error': structured.get('error'),
                  'cwd': structured.get('cwd'),
                  'duration_ms': structured.get('duration_ms'),
              })

          result_path.parent.mkdir(parents=True, exist_ok=True)
          result_path.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(result, indent=2))
          PY

      - name: Commit result to command branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .chatgpt-terminal/result.json
          if git diff --cached --quiet; then
            echo 'No result change to commit.'
            exit 0
          fi
          git commit -m 'terminal: record ChatGPT bridge result [skip ci]'
          git push origin HEAD:chatgpt-terminal
