name: TEMP Node Graph Audit

on:
  push:
    branches:
      - canon/complete-node-graph-2026-09-12

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canon/complete-node-graph-2026-09-12
      - name: Normalize legacy node metadata
        run: python3 scripts/normalize_legacy_node_metadata.py
      - name: Run graph audit
        shell: bash
        run: |
          set +e
          {
            echo '=== sync check ==='
            python3 scripts/sync_node_graph_indexes.py --check
            echo "sync_exit=$?"
            echo '=== graph audit ==='
            python3 scripts/node_graph_integrity.py
            echo "audit_exit=$?"
          } > NODE_GRAPH_AUDIT_RESULTS.txt 2>&1
          cat NODE_GRAPH_AUDIT_RESULTS.txt
      - name: Commit normalization and audit receipt
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Nodes NODE_GRAPH_AUDIT_RESULTS.txt
          if git diff --cached --quiet; then
            echo 'No normalization changes.'
            exit 0
          fi
          git commit -m 'nodes: normalize legacy I-06 metadata'
          git push origin HEAD:canon/complete-node-graph-2026-09-12
      - name: Require clean audit
        shell: bash
        run: |
          grep -q '^sync_exit=0$' NODE_GRAPH_AUDIT_RESULTS.txt
          grep -q '^audit_exit=0$' NODE_GRAPH_AUDIT_RESULTS.txt
