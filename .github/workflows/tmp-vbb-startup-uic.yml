name: tmp-vbb-startup-uic
on:
  push:
    branches: [virtual-breadboard-startup-uic]
    paths:
      - '.github/workflows/tmp-vbb-startup-uic.yml'
      - '.github/scripts/patch_vbb_startup_uic.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: virtual-breadboard-startup-uic
      - run: python .github/scripts/patch_vbb_startup_uic.py
      - run: |
          git config user.name "Mark Wright"
          git config user.email "markluvsoliviaduh@gmail.com"
          git add Virtual_Breadboard/js/circuit.js Virtual_Breadboard/js/spice-analysis.js
          git commit -m "Virtual Breadboard: add startup and UIC transient analysis"
          git push origin HEAD:virtual-breadboard-startup-uic
