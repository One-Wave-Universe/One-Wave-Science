name: tmp-vbb-mosfet-ac-symbol
on:
  push:
    branches: [virtual-breadboard-mosfet-model-cards]
    paths:
      - '.github/workflows/tmp-vbb-mosfet-ac-symbol.yml'
      - '.github/scripts/fix_vbb_mosfet_ac_symbol.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: virtual-breadboard-mosfet-model-cards
      - run: python .github/scripts/fix_vbb_mosfet_ac_symbol.py
      - run: |
          git config user.name "Mark Wright"
          git config user.email "markluvsoliviaduh@gmail.com"
          git add Virtual_Breadboard/js/ac-analysis.js
          git commit -m "Fix MOSFET AC Ciss frequency symbol"
          git push origin HEAD:virtual-breadboard-mosfet-model-cards
