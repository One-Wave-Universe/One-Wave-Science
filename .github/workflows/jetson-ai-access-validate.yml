name: Jetson AI Access Validate

on:
  push:
    paths:
      - 'JETSON_AI_ACCESS.md'
      - 'AI_BRIDGE_START_HERE.md'
      - 'AI_JETSON_TOOL_GUIDE.md'
      - 'External_Work/**'
      - 'bridge-transport/hive-pipe/**'
      - 'scripts/install_jetson_gateway.sh'
      - 'scripts/enable_jetson_ssh.sh'
      - 'scripts/jetson_remote.sh'
      - 'scripts/external_work_bridge.py'
      - '.github/workflows/jetson-command.yml'
      - '.github/workflows/jetson-ai-access-validate.yml'
  pull_request:
    paths:
      - 'JETSON_AI_ACCESS.md'
      - 'AI_BRIDGE_START_HERE.md'
      - 'AI_JETSON_TOOL_GUIDE.md'
      - 'External_Work/**'
      - 'bridge-transport/hive-pipe/**'
      - 'scripts/install_jetson_gateway.sh'
      - 'scripts/enable_jetson_ssh.sh'
      - 'scripts/jetson_remote.sh'
      - 'scripts/external_work_bridge.py'
      - '.github/workflows/jetson-command.yml'
      - '.github/workflows/jetson-ai-access-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Canonical Bridge-Comand transport
        uses: actions/checkout@v4
        with:
          repository: One-Wave-Universe/Bridge-Comand
          ref: cf63d3bca9c49dddf7fc2fe50420c2499a9714cc
          path: bridge-transport

      - name: Shell syntax
        run: |
          bash -n bridge-transport/hive-pipe/agent.sh
          bash -n bridge-transport/hive-pipe/install_gateway.sh
          bash -n bridge-transport/hive-pipe/install_chatgpt_terminal_pull.sh
          bash -n bridge-transport/hive-pipe/bootstrap_chatgpt_terminal_pull.sh
          bash -n scripts/install_jetson_gateway.sh
          bash -n scripts/enable_jetson_ssh.sh
          bash -n scripts/jetson_remote.sh

      - name: Python syntax
        run: |
          python3 -m py_compile \
            bridge-transport/hive-pipe/gateway.py \
            bridge-transport/hive-pipe/mudl.py \
            bridge-transport/hive-pipe/terminal_parser.py \
            bridge-transport/hive-pipe/chatgpt_terminal_pull.py \
            bridge-transport/hive-pipe/bridge_doctor.py \
            bridge-transport/hive-pipe/deepseek_bridge.py \
            bridge-transport/hive-pipe/deepseek_web_bridge.py \
            scripts/external_work_bridge.py

      - name: Hive Pipe MCP terminal tests
        run: python3 -m unittest discover -s bridge-transport/hive-pipe -p 'test_*.py' -v

      - name: Unified bridge contracts
        run: python3 bridge-transport/hive-pipe/bridge_doctor.py --profile ci

      - name: External work bridge smoke test
        run: |
          set -euo pipefail
          export ONE_WAVE_EXTERNAL_WORK="$RUNNER_TEMP/One-Wave-External-Work"
          mkdir -p External_Work/inbox External_Work/outbox
          printf 'from-github\n' > External_Work/inbox/ci-github-to-jetson.txt
          python3 scripts/external_work_bridge.py pull
          test "$(cat "$ONE_WAVE_EXTERNAL_WORK/inbox/ci-github-to-jetson.txt")" = "from-github"
          printf 'from-jetson\n' > "$ONE_WAVE_EXTERNAL_WORK/outbox/ci-jetson-to-github.txt"
          python3 scripts/external_work_bridge.py publish
          test "$(cat External_Work/outbox/ci-jetson-to-github.txt)" = "from-jetson"
          echo "external work bridge: PASS"

      - name: GitHub command lane uses MCP terminal parser
        run: |
          set -euo pipefail
          grep -q '"name": "terminal_run"' .github/workflows/jetson-command.yml
          grep -q ' + "/mcp"' .github/workflows/jetson-command.yml
          if grep -q '/v1/exec' .github/workflows/jetson-command.yml; then
            echo "::error::Jetson Command Lane still references legacy /v1/exec"
            exit 1
          fi
          echo "github -> jetson MCP route: PASS"
