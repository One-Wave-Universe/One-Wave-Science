name: Bridge Routes Validate

on:
  push:
    paths:
      - 'One_Wave_Bench/bridges/**'
      - '.github/workflows/jetson-command.yml'
      - '.github/workflows/jetson-ai-access-validate.yml'
  pull_request:
    paths:
      - 'One_Wave_Bench/bridges/**'
      - '.github/workflows/jetson-command.yml'
      - '.github/workflows/jetson-ai-access-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate bridge scripts
        run: |
          set -euo pipefail
          for f in One_Wave_Bench/bridges/scripts/*.sh; do bash -n "$f"; done
          python3 -m py_compile One_Wave_Bench/bridges/scripts/*.py
          python3 -m py_compile One_Wave_Bench/bridges/open-data/*.py
      - name: Validate Hive Pipe
        run: |
          python3 -m unittest discover -s One_Wave_Bench/bridges/hive-pipe -p 'test_*.py' -v
          python3 One_Wave_Bench/bridges/hive-pipe/bridge_doctor.py --profile ci
      - name: External work relay smoke test
        run: |
          set -euo pipefail
          export ONE_WAVE_EXTERNAL_WORK="$RUNNER_TEMP/One-Wave-External-Work"
          mkdir -p One_Wave_Bench/bridges/external-work/External_Work/inbox
          mkdir -p One_Wave_Bench/bridges/external-work/External_Work/outbox
          printf 'from-github\n' > One_Wave_Bench/bridges/external-work/External_Work/inbox/ci-github-to-jetson.txt
          python3 One_Wave_Bench/bridges/scripts/external_work_bridge.py pull
          test "$(cat "$ONE_WAVE_EXTERNAL_WORK/inbox/ci-github-to-jetson.txt")" = "from-github"
          printf 'from-jetson\n' > "$ONE_WAVE_EXTERNAL_WORK/outbox/ci-jetson-to-github.txt"
          python3 One_Wave_Bench/bridges/scripts/external_work_bridge.py publish
          test "$(cat One_Wave_Bench/bridges/external-work/External_Work/outbox/ci-jetson-to-github.txt)" = "from-jetson"
      - name: Command lane contract
        run: |
          set -euo pipefail
          grep -q '"name": "terminal_run"' .github/workflows/jetson-command.yml
          grep -q ' + "/mcp"' .github/workflows/jetson-command.yml
          ! grep -q '/v1/exec' .github/workflows/jetson-command.yml
