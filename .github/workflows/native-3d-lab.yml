name: Native 3D physics lab
on:
  pull_request:
    paths: ['One_Wave_Simulator/**', 'solvers/bulk_excitation.py', 'solvers/joint_boundary_response.py', '.github/workflows/native-3d-lab.yml']
  push:
    branches: [main, 'feature/native-3d-physics-lab-*']
    paths: ['One_Wave_Simulator/**', 'solvers/bulk_excitation.py', 'solvers/joint_boundary_response.py', '.github/workflows/native-3d-lab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install numpy scipy
      - run: |
          python One_Wave_Simulator/native_3d/test_lab.py
          python solvers/test_bulk_excitation.py
          python solvers/test_joint_boundary_response.py
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python One_Wave_Simulator/native_3d/server.py > /tmp/native-3d-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/api/state >/dev/null && break; sleep 1; done
          LAB_ARTIFACTS=/tmp/native-3d-proof node One_Wave_Simulator/native_3d/test_ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-3d-proof
          path: |
            /tmp/native-3d-proof
            /tmp/native-3d-server.log
