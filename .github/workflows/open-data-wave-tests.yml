name: Open data wave tests

on:
  pull_request:
    paths:
      - 'scripts/open_data_to_wave.py'
      - 'scripts/test_open_data_to_wave.py'
      - 'One_Wave_Bench/data/OPEN_DATA_WAVE_PIPELINE.md'
      - '.github/workflows/open-data-wave-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/open_data_to_wave.py'
      - 'scripts/test_open_data_to_wave.py'
      - 'One_Wave_Bench/data/OPEN_DATA_WAVE_PIPELINE.md'
      - '.github/workflows/open-data-wave-tests.yml'

permissions:
  contents: read

jobs:
  adapter-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Adapter contract and metadata regression
        run: |
          python scripts/test_open_data_to_wave.py
          python scripts/test_science_metadata_bundle.py
          python -m py_compile scripts/open_data_to_wave.py
