name: tmp-vbb-pwl-pulse
on:
  push:
    branches: [virtual-breadboard-pwl-pulse-sources]
    paths:
      - '.github/workflows/tmp-vbb-pwl-pulse.yml'
      - '.github/scripts/patch_vbb_pwl_pulse.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: virtual-breadboard-pwl-pulse-sources
      - run: python .github/scripts/patch_vbb_pwl_pulse.py
      - run: |
          git config user.name "Mark Wright"
          git config user.email "markluvsoliviaduh@gmail.com"
          git add Virtual_Breadboard/js/circuit.js
          git commit -m "Virtual Breadboard: add PWL and pulse sources"
          git push origin HEAD:virtual-breadboard-pwl-pulse-sources
