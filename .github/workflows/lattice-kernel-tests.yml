name: Lattice Kernel Tests

on:
  pull_request:
    paths:
      - 'sims/00-lattice-primitive/**'
      - 'sims/24-1-sandbox/**'
      - 'sims/06-spectral-lattice-phase/**'
      - 'sims/00-state-container/state-schema.json'
      - '.github/workflows/lattice-kernel-tests.yml'
  push:
    branches: [main]
    paths:
      - 'sims/00-lattice-primitive/**'
      - 'sims/24-1-sandbox/**'
      - 'sims/06-spectral-lattice-phase/**'
      - 'sims/00-state-container/state-schema.json'
      - '.github/workflows/lattice-kernel-tests.yml'

permissions:
  contents: read

jobs:
  numerical-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kernel and UI integration controls
        run: node --test sims/00-lattice-primitive/test_lattice_kernel.js
      - name: Slot 1 adapter and reproducible receipts
        run: node --test sims/24-1-sandbox/modules/01-lattice-primitive/test_adapter.js
      - name: Dispersion and octave controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s sims/00-lattice-primitive -p 'test*.py' -v
      - name: Sandbox registry negative and reference-path controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s sims/24-1-sandbox -p 'test*.py' -v
          python sims/24-1-sandbox/sandbox.py --json
      - name: Slot 6 static spectral adapter and source controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s sims/24-1-sandbox/modules/06-spectral-lattice-phase -p 'test*.py' -v
          python sims/06-spectral-lattice-phase/test_spectral_lattice_phase.py
          python sims/24-1-sandbox/modules/06-spectral-lattice-phase/adapter.py > spectral-receipt.json
