name: Lattice Kernel Tests

on:
  pull_request:
    paths:
      - 'sims/**'
      - 'Nodes/**'
      - 'Governance_I_Series/I-06_Canonical_Node_Metadata_and_Alias_Resolution.md'
      - 'AGENTS.md'
      - 'GENERAL_REFERENCE_RULES.md'
      - 'AI_CANONICAL_START_HERE.md'
      - '.github/workflows/lattice-kernel-tests.yml'
  push:
    branches: [main]
    paths:
      - 'sims/**'
      - 'Nodes/**'
      - 'Governance_I_Series/I-06_Canonical_Node_Metadata_and_Alias_Resolution.md'
      - 'AGENTS.md'
      - 'GENERAL_REFERENCE_RULES.md'
      - 'AI_CANONICAL_START_HERE.md'
      - '.github/workflows/lattice-kernel-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: module-refresh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  numerical-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      REFRESH_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      REFRESH_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      REFRESH_BUNDLE: module-refresh-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh controller safety contracts
        run: python -m unittest discover -s sims/24-1-sandbox -p 'test_refresh.py' -v
      - name: Reference, affected tests, receipts, return reference
        shell: bash
        run: |
          args=(--expected-head "$REFRESH_HEAD" --output "$RUNNER_TEMP/$REFRESH_BUNDLE")
          if [[ -n "$REFRESH_BASE" ]]; then args+=(--base "$REFRESH_BASE"); fi
          python sims/24-1-sandbox/refresh.py "${args[@]}"
      - name: Retain exact-head receipts and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-refresh-${{ env.REFRESH_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ env.REFRESH_BUNDLE }}
          if-no-files-found: warn
          retention-days: 14
