name: tmp-vbb-mosfet-full-verify
on:
  push:
    branches: [virtual-breadboard-mosfet-model-cards]
    paths:
      - '.github/workflows/tmp-vbb-mosfet-full-verify.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: Virtual_Breadboard
    steps:
      - uses: actions/checkout@v4
        with:
          ref: virtual-breadboard-mosfet-model-cards
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node test/run_flashlight_calibration.js
      - run: node test/run_regression_builds.js
      - run: node test/conventional-flashlight-reference.test.js
      - run: npm run test:spice-analysis
      - run: npm run test:solver-convergence
      - run: npm run test:dc-op
      - run: npm run test:stepping
      - run: npm run test:diode-newton
      - run: npm run test:mosfet-continuous
      - run: npm run test:mosfet-model-cards
      - run: npm run test:spice-tolerances
      - run: npm run test:ac-analysis
      - run: npm run test:bode
      - run: npm run test:pole-zero
      - run: npm run test:controlled-sources
      - run: npm run test:bjt
