name: tmp-vbb-mosfet-card-baseline
on:
  push:
    branches: [virtual-breadboard-mosfet-model-cards]
    paths:
      - '.github/workflows/tmp-vbb-mosfet-card-baseline.yml'
      - '.github/scripts/fix_vbb_mosfet_card_baseline.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: virtual-breadboard-mosfet-model-cards
      - run: python .github/scripts/fix_vbb_mosfet_card_baseline.py
      - run: |
          git config user.name "Mark Wright"
          git config user.email "markluvsoliviaduh@gmail.com"
          git add Virtual_Breadboard/js/circuit.js
          git commit -m "Preserve MOSFET body-diode baseline in model cards"
          git push origin HEAD:virtual-breadboard-mosfet-model-cards
