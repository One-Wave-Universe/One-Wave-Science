name: tmp-vbb-integration-methods
on:
  push:
    branches: [virtual-breadboard-integration-methods]
    paths:
      - '.github/workflows/tmp-vbb-integration-methods.yml'
      - '.github/scripts/patch_vbb_integration_methods.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: virtual-breadboard-integration-methods
      - run: python .github/scripts/patch_vbb_integration_methods.py
      - run: |
          git config user.name "Mark Wright"
          git config user.email "markluvsoliviaduh@gmail.com"
          git add Virtual_Breadboard/js/circuit.js
          git commit -m "Virtual Breadboard: add trapezoidal and Gear2 integration"
          git push origin HEAD:virtual-breadboard-integration-methods
