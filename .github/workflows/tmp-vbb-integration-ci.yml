name: tmp-vbb-integration-ci
on:
  push:
    branches: [virtual-breadboard-integration-methods]
    paths:
      - '.github/workflows/tmp-vbb-integration-ci.yml'
      - '.github/scripts/wire_vbb_integration_ci.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: virtual-breadboard-integration-methods
      - run: python .github/scripts/wire_vbb_integration_ci.py
      - run: |
          git config user.name "Mark Wright"
          git config user.email "markluvsoliviaduh@gmail.com"
          git add Virtual_Breadboard/package.json .github/workflows/breadboard-flashlight-tests.yml
          git commit -m "Add integration-method CI qualification"
          git push origin HEAD:virtual-breadboard-integration-methods
