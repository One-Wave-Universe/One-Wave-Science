name: tmp-vbb-convergence-diagnostics
on:
  push:
    branches: [virtual-breadboard-convergence-diagnostics]
    paths:
      - '.github/workflows/tmp-vbb-convergence-diagnostics.yml'
      - '.github/scripts/patch_vbb_convergence_diagnostics.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: virtual-breadboard-convergence-diagnostics
      - run: python .github/scripts/patch_vbb_convergence_diagnostics.py
      - run: |
          git config user.name "Mark Wright"
          git config user.email "markluvsoliviaduh@gmail.com"
          git add Virtual_Breadboard/js/circuit.js
          git commit -m "Virtual Breadboard: add deterministic convergence diagnostics"
          git push origin HEAD:virtual-breadboard-convergence-diagnostics
