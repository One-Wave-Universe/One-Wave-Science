name: Virtual Breadboard - Flashlight Tests

on:
  push:
    paths:
      - 'Virtual_Breadboard/js/**'
      - 'Virtual_Breadboard/test/flashlight-calibration/**'
      - 'Virtual_Breadboard/test/run_flashlight_calibration.js'
      - 'Virtual_Breadboard/test/conventional-flashlight-reference.test.js'
      - 'Virtual_Breadboard/test/regression-builds/**'
      - 'Virtual_Breadboard/test/run_regression_builds.js'
      - 'Virtual_Breadboard/test/spice-analysis.test.js'
      - 'Virtual_Breadboard/test/solver-convergence.test.js'
      - 'Virtual_Breadboard/test/dc-operating-point.test.js'
      - 'Virtual_Breadboard/package.json'
      - 'One_Wave_Bench/flashlight/**'
      - 'ARCHITECTURE_BALANCED_CELL_STACK_PARSER_MATRIX.md'
      - '.github/workflows/breadboard-flashlight-tests.yml'
  pull_request:
    paths:
      - 'Virtual_Breadboard/js/**'
      - 'Virtual_Breadboard/test/flashlight-calibration/**'
      - 'Virtual_Breadboard/test/run_flashlight_calibration.js'
      - 'Virtual_Breadboard/test/conventional-flashlight-reference.test.js'
      - 'Virtual_Breadboard/test/regression-builds/**'
      - 'Virtual_Breadboard/test/run_regression_builds.js'
      - 'Virtual_Breadboard/test/spice-analysis.test.js'
      - 'Virtual_Breadboard/test/solver-convergence.test.js'
      - 'Virtual_Breadboard/test/dc-operating-point.test.js'
      - 'Virtual_Breadboard/package.json'
      - 'One_Wave_Bench/flashlight/**'
      - 'ARCHITECTURE_BALANCED_CELL_STACK_PARSER_MATRIX.md'
      - '.github/workflows/breadboard-flashlight-tests.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flashlight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: Virtual_Breadboard
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: virtual-breadboard-source-gmin-stepping

      - name: Patch configurable GMIN once
        working-directory: .
        shell: python
        run: |
          from pathlib import Path
          p = Path('Virtual_Breadboard/js/circuit.js')
          s = p.read_text()
          if 'const solveGmin =' not in s:
              old = """      const requestedMaxIterations = solverOptions && Number.isFinite(solverOptions.maxIterations)\n        ? Math.max(1, Math.floor(solverOptions.maxIterations))\n        : 30;"""
              new = """      const requestedMaxIterations = solverOptions && Number.isFinite(solverOptions.maxIterations)\n        ? Math.max(1, Math.floor(solverOptions.maxIterations))\n        : 30;\n      const solveGmin = solverOptions && Number.isFinite(solverOptions.gmin)\n        ? Math.max(0, solverOptions.gmin)\n        : GMIN;"""
              if old not in s: raise SystemExit('solver-options anchor not found')
              s = s.replace(old, new, 1)
              old = '          stampG(i, i, GMIN);'
              if old not in s: raise SystemExit('GMIN stamp anchor not found')
              s = s.replace(old, '          stampG(i, i, solveGmin);', 1)
              old = """        relTolerance,\n      };"""
              new = """        relTolerance,\n        gmin: solveGmin,\n      };"""
              if old not in s: raise SystemExit('solver metadata anchor not found')
              s = s.replace(old, new, 1)
              p.write_text(s)

      - name: Commit GMIN patch if needed
        working-directory: .
        run: |
          if ! git diff --quiet -- Virtual_Breadboard/js/circuit.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Virtual_Breadboard/js/circuit.js
            git commit -m "Virtual Breadboard: make GMIN solver-configurable"
            git push
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run flashlight primitive calibration pack
        run: node test/run_flashlight_calibration.js

      - name: Run balanced-cell / nerve / reference regressions
        run: node test/run_regression_builds.js

      - name: Run conventional flashlight reference only
        run: node test/conventional-flashlight-reference.test.js

      - name: Run SPICE-style DC analysis qualification
        run: npm run test:spice-analysis

      - name: Run solver convergence qualification
        run: npm run test:solver-convergence

      - name: Run true DC operating point qualification
        run: npm run test:dc-op
