name: Virtual Breadboard - Flashlight Tests

on:
  push:
    paths:
      - 'Virtual_Breadboard/js/**'
      - 'Virtual_Breadboard/test/flashlight-calibration/**'
      - 'Virtual_Breadboard/test/run_flashlight_calibration.js'
      - 'Virtual_Breadboard/test/conventional-flashlight-reference.test.js'
      - 'Virtual_Breadboard/test/regression-builds/**'
      - 'Virtual_Breadboard/test/run_regression_builds.js'
      - 'Virtual_Breadboard/test/spice-analysis.test.js'
      - 'Virtual_Breadboard/test/solver-convergence.test.js'
      - 'Virtual_Breadboard/test/dc-operating-point.test.js'
      - 'Virtual_Breadboard/test/source-gmin-stepping.test.js'
      - 'Virtual_Breadboard/test/diode-newton.test.js'
      - 'Virtual_Breadboard/test/mosfet-continuous.test.js'
      - 'Virtual_Breadboard/test/spice-tolerances.test.js'
      - 'Virtual_Breadboard/test/ac-analysis.test.js'
      - 'Virtual_Breadboard/test/bode-analysis.test.js'
      - 'Virtual_Breadboard/test/pole-zero-sanity.test.js'
      - 'Virtual_Breadboard/package.json'
      - 'One_Wave_Bench/flashlight/**'
      - 'ARCHITECTURE_BALANCED_CELL_STACK_PARSER_MATRIX.md'
      - '.github/workflows/breadboard-flashlight-tests.yml'
  pull_request:
    paths:
      - 'Virtual_Breadboard/js/**'
      - 'Virtual_Breadboard/test/flashlight-calibration/**'
      - 'Virtual_Breadboard/test/run_flashlight_calibration.js'
      - 'Virtual_Breadboard/test/conventional-flashlight-reference.test.js'
      - 'Virtual_Breadboard/test/regression-builds/**'
      - 'Virtual_Breadboard/test/run_regression_builds.js'
      - 'Virtual_Breadboard/test/spice-analysis.test.js'
      - 'Virtual_Breadboard/test/solver-convergence.test.js'
      - 'Virtual_Breadboard/test/dc-operating-point.test.js'
      - 'Virtual_Breadboard/test/source-gmin-stepping.test.js'
      - 'Virtual_Breadboard/test/diode-newton.test.js'
      - 'Virtual_Breadboard/test/mosfet-continuous.test.js'
      - 'Virtual_Breadboard/test/spice-tolerances.test.js'
      - 'Virtual_Breadboard/test/ac-analysis.test.js'
      - 'Virtual_Breadboard/test/bode-analysis.test.js'
      - 'Virtual_Breadboard/test/pole-zero-sanity.test.js'
      - 'Virtual_Breadboard/package.json'
      - 'One_Wave_Bench/flashlight/**'
      - 'ARCHITECTURE_BALANCED_CELL_STACK_PARSER_MATRIX.md'
      - '.github/workflows/breadboard-flashlight-tests.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-controlled-sources:
    if: github.ref == 'refs/heads/virtual-breadboard-controlled-sources'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: virtual-breadboard-controlled-sources
      - run: python .github/scripts/patch_vbb_controlled_sources.py
      - run: |
          git config user.name "Mark Wright"
          git config user.email "markluvsoliviaduh@gmail.com"
          git add Virtual_Breadboard/js/circuit.js Virtual_Breadboard/js/ac-analysis.js
          git commit -m "Virtual Breadboard: add current and controlled sources"
          git push origin HEAD:virtual-breadboard-controlled-sources

  flashlight:
    if: github.ref != 'refs/heads/virtual-breadboard-controlled-sources' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: Virtual_Breadboard
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run flashlight primitive calibration pack
        run: node test/run_flashlight_calibration.js

      - name: Run balanced-cell / nerve / reference regressions
        run: node test/run_regression_builds.js

      - name: Run conventional flashlight reference only
        run: node test/conventional-flashlight-reference.test.js

      - name: Run SPICE-style DC analysis qualification
        run: npm run test:spice-analysis

      - name: Run solver convergence qualification
        run: npm run test:solver-convergence

      - name: Run true DC operating point qualification
        run: npm run test:dc-op

      - name: Run source and GMIN stepping qualification
        run: npm run test:stepping

      - name: Run continuous diode Newton qualification
        run: npm run test:diode-newton

      - name: Run continuous MOSFET qualification
        run: npm run test:mosfet-continuous

      - name: Run SPICE convergence tolerance qualification
        run: npm run test:spice-tolerances

      - name: Run small-signal AC analysis qualification
        run: npm run test:ac-analysis

      - name: Run Bode transfer qualification
        run: npm run test:bode

      - name: Run pole-zero sanity qualification
        run: npm run test:pole-zero
