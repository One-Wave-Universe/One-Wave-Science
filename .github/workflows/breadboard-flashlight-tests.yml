      - 'Virtual_Breadboard/test/diode-newton.test.js'
      - 'Virtual_Breadboard/test/mosfet-continuous.test.js'
      - 'Virtual_Breadboard/test/mosfet-model-cards.test.js'
      - 'Virtual_Breadboard/test/pwl-pulse-sources.test.js'
      - 'Virtual_Breadboard/test/startup-uic.test.js'
      - 'Virtual_Breadboard/test/sparse-mna.test.js'
      - 'Virtual_Breadboard/test/adaptive-transient.test.js'
      - 'Virtual_Breadboard/test/integration-methods.test.js'
      - 'Virtual_Breadboard/test/convergence-diagnostics.test.js'
      - 'Virtual_Breadboard/test/spice-tolerances.test.js'
      - 'Virtual_Breadboard/test/ac-analysis.test.js'
      - 'Virtual_Breadboard/test/bode-analysis.test.js'
      - 'Virtual_Breadboard/test/pole-zero-sanity.test.js'
      - 'Virtual_Breadboard/test/controlled-sources.test.js'
      - 'Virtual_Breadboard/test/bjt.test.js'
      - 'Virtual_Breadboard/test/ngspice-crosscheck.test.js'
      - 'Virtual_Breadboard/test/ngspice-tolerances.json'
      - 'Virtual_Breadboard/package.json'
      - 'One_Wave_Bench/flashlight/**'
      - 'ARCHITECTURE_BALANCED_CELL_STACK_PARSER_MATRIX.md'
      - '.github/workflows/breadboard-flashlight-tests.yml'
  pull_request:
    paths:
      - 'Virtual_Breadboard/main.js'
      - 'Virtual_Breadboard/preload.js'
      - 'Virtual_Breadboard/index.html'
      - 'Virtual_Breadboard/style.css'
      - 'Virtual_Breadboard/js/**'
      - 'Virtual_Breadboard/10_RECEIPTS/cell_v1_stamp*.py'
      - 'Virtual_Breadboard/test/flashlight-calibration/**'
      - 'Virtual_Breadboard/test/run_flashlight_calibration.js'
      - 'Virtual_Breadboard/test/conventional-flashlight-reference.test.js'
      - 'Virtual_Breadboard/test/regression-builds/**'
      - 'Virtual_Breadboard/test/run_regression_builds.js'
      - 'Virtual_Breadboard/test/practice-interface.test.js'
      - 'Virtual_Breadboard/simulate.js'
      - 'Virtual_Breadboard/test/spice-analysis.test.js'
      - 'Virtual_Breadboard/test/solver-convergence.test.js'
      - 'Virtual_Breadboard/test/dc-operating-point.test.js'
      - 'Virtual_Breadboard/test/source-gmin-stepping.test.js'
      - 'Virtual_Breadboard/test/diode-newton.test.js'
      - 'Virtual_Breadboard/test/mosfet-continuous.test.js'
      - 'Virtual_Breadboard/test/mosfet-model-cards.test.js'
      - 'Virtual_Breadboard/test/pwl-pulse-sources.test.js'
      - 'Virtual_Breadboard/test/startup-uic.test.js'
      - 'Virtual_Breadboard/test/sparse-mna.test.js'
      - 'Virtual_Breadboard/test/adaptive-transient.test.js'
      - 'Virtual_Breadboard/test/integration-methods.test.js'
      - 'Virtual_Breadboard/test/convergence-diagnostics.test.js'
      - 'Virtual_Breadboard/test/spice-tolerances.test.js'
      - 'Virtual_Breadboard/test/ac-analysis.test.js'
      - 'Virtual_Breadboard/test/bode-analysis.test.js'
      - 'Virtual_Breadboard/test/pole-zero-sanity.test.js'
      - 'Virtual_Breadboard/test/controlled-sources.test.js'
      - 'Virtual_Breadboard/test/bjt.test.js'
      - 'Virtual_Breadboard/test/ngspice-crosscheck.test.js'
      - 'Virtual_Breadboard/test/ngspice-tolerances.json'
      - 'Virtual_Breadboard/package.json'
      - 'One_Wave_Bench/flashlight/**'
      - 'ARCHITECTURE_BALANCED_CELL_STACK_PARSER_MATRIX.md'
      - '.github/workflows/breadboard-flashlight-tests.yml'
  workflow_dispatch:

jobs:
  flashlight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Virtual_Breadboard
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ngspice and desktop display dependencies
        run: sudo apt-get update && sudo apt-get install -y ngspice xvfb libgtk-3-0 libnss3 libasound2t64
        working-directory: .

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund

      - name: Run human and AI practice interface regressions
        run: npm run test:practice-interface

      - name: Run CELL_V1 Stamp 1/2 software receipts
        run: |
          python3 10_RECEIPTS/cell_v1_stamp1_rails.py
          python3 10_RECEIPTS/cell_v1_stamp2_bridge.py

      - name: Run flashlight primitive calibration pack
        run: node test/run_flashlight_calibration.js

      - name: Run balanced-cell / nerve / reference regressions
        run: node test/run_regression_builds.js

      - name: Run conventional flashlight reference only
        run: node test/conventional-flashlight-reference.test.js

      - name: Run SPICE-style DC analysis qualification
        run: npm run test:spice-analysis

      - name: Run solver convergence qualification
        run: npm run test:solver-convergence

      - name: Run true DC operating point qualification
        run: npm run test:dc-op

      - name: Run source and GMIN stepping qualification
        run: npm run test:stepping

      - name: Run continuous diode Newton qualification
        run: npm run test:diode-newton

      - name: Run continuous MOSFET qualification
        run: npm run test:mosfet-continuous

      - name: Run MOSFET model-card qualification
        run: npm run test:mosfet-model-cards

      - name: Run PWL and pulse transient-source qualification
        run: npm run test:pwl-pulse

      - name: Run startup and UIC transient qualification
        run: npm run test:startup-uic

      - name: Run sparse MNA qualification
        run: npm run test:sparse-mna

      - name: Run adaptive transient qualification
        run: npm run test:adaptive-transient

      - name: Run trapezoidal and Gear2 integration qualification
        run: npm run test:integration-methods

      - name: Run deterministic convergence diagnostics qualification
        run: npm run test:convergence-diagnostics

      - name: Run SPICE convergence tolerance qualification
        run: npm run test:spice-tolerances

      - name: Run small-signal AC analysis qualification
        run: npm run test:ac-analysis

      - name: Run Bode transfer qualification
        run: npm run test:bode

      - name: Run pole-zero sanity qualification
        run: npm run test:pole-zero

      - name: Run current and controlled-source qualification
        run: npm run test:controlled-sources

      - name: Run continuous Ebers-Moll BJT qualification
        run: npm run test:bjt

      - name: Run ngspice cross-check qualification
        run: npm run test:ngspice

      # GitHub's disposable runner cannot configure Electron's SUID sandbox
      # helper as a normal desktop installation would. --no-sandbox is a CI-
      # only launch exception; main.js still ships with renderer sandbox:true.
      - name: Run Electron source desktop acceptance
        env:
          BREADBOARD_SMOKE_SCREENSHOT: /tmp/breadboard-practice-source.png
        run: xvfb-run --auto-servernum npx electron . --smoke-test --no-sandbox

      - name: Preserve desktop practice screenshot
        uses: actions/upload-artifact@v4
        with:
          name: breadboard-practice-screenshot
          path: /tmp/breadboard-practice-source.png
          if-no-files-found: error

      - name: Build unpacked Linux x64 desktop application
        run: npm run dist:linux-dir

      - name: Run packaged Linux x64 desktop acceptance
        run: xvfb-run --auto-servernum ./dist/linux-unpacked/virtual-breadboard-simulator --smoke-test --no-sandbox


      - name: Archive and verify downloadable Linux x64 application
        run: |
          printf '%s\n' \
            'Virtual Breadboard Simulator - Linux x64 portable directory' \
            'Extract the tar.gz archive, then run ./linux-unpacked/virtual-breadboard-simulator as your normal desktop user.' \
            'Requires a Linux x86_64 desktop with Electron-compatible GTK, NSS and ALSA libraries. Tested on GitHub ubuntu-latest.' \
            'This includes the Electron runtime; Node.js and npm are not needed to run the app.' \
            'Keep the full extracted directory together. This is not an installer and does not configure your system.' \
            'Keep the Electron sandbox enabled; the CI-only --no-sandbox flag is not a desktop launch recommendation.' \
            'Circuit results are modeled evidence only, not physical-bench qualification or a guarantee of electrical safety.' \
            > dist/linux-unpacked/README-linux.txt
          test -x dist/linux-unpacked/virtual-breadboard-simulator
          test -f dist/linux-unpacked/resources/app.asar
          if find dist/linux-unpacked \( -name '.git' -o -name '.env' -o -name '.npmrc' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .; then
            echo 'Unexpected private or source-control file in package' >&2
            exit 1
          fi
          tar -C dist -czf dist/virtual-breadboard-linux-x64.tar.gz linux-unpacked
          (cd dist && sha256sum virtual-breadboard-linux-x64.tar.gz > virtual-breadboard-linux-x64.tar.gz.sha256)
          verify_dir=$(mktemp -d)
          trap 'rm -rf "$verify_dir"' EXIT
          tar -xzf dist/virtual-breadboard-linux-x64.tar.gz -C "$verify_dir"
          test -x "$verify_dir/linux-unpacked/virtual-breadboard-simulator"
          test -f "$verify_dir/linux-unpacked/resources/app.asar"
          test -s "$verify_dir/linux-unpacked/README-linux.txt"
          (cd dist && sha256sum -c virtual-breadboard-linux-x64.tar.gz.sha256)
          xvfb-run --auto-servernum "$verify_dir/linux-unpacked/virtual-breadboard-simulator" --smoke-test --no-sandbox
          tar -tzf dist/virtual-breadboard-linux-x64.tar.gz
          stat -c '%n: %s bytes' dist/virtual-breadboard-linux-x64.tar.gz

      - name: Preserve verified downloadable Linux x64 application
        uses: actions/upload-artifact@v4
        with:
          name: virtual-breadboard-linux-x64
          path: |
            Virtual_Breadboard/dist/virtual-breadboard-linux-x64.tar.gz
            Virtual_Breadboard/dist/virtual-breadboard-linux-x64.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
