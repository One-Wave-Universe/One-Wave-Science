name: tmp-vbb-gear-variable-dt
on:
  push:
    branches: [virtual-breadboard-integration-methods]
    paths:
      - '.github/workflows/tmp-vbb-gear-variable-dt.yml'
      - '.github/scripts/fix_vbb_gear_variable_dt.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: virtual-breadboard-integration-methods
      - run: python .github/scripts/fix_vbb_gear_variable_dt.py
      - run: |
          git config user.name "Mark Wright"
          git config user.email "markluvsoliviaduh@gmail.com"
          git add Virtual_Breadboard/js/circuit.js
          git commit -m "Virtual Breadboard: make Gear2 variable-step correct"
          git push origin HEAD:virtual-breadboard-integration-methods
