name: TEMP Node Graph Sync

on:
  push:
    branches:
      - canon/complete-node-graph-2026-09-12

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canon/complete-node-graph-2026-09-12
      - name: Sync master index and AI start
        run: python3 scripts/sync_node_graph_indexes.py
      - name: Commit synchronized files
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 00_MASTER_INDEX.md AI_CANONICAL_START_HERE.md
          git commit -m 'docs: sync canonical node graph indexes'
          git push origin HEAD:canon/complete-node-graph-2026-09-12
