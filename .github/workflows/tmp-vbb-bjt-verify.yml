name: tmp-vbb-bjt-verify
on:
  push:
    branches: [virtual-breadboard-bjt-support]
    paths:
      - '.github/workflows/tmp-vbb-bjt-verify.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Virtual_Breadboard
    steps:
      - uses: actions/checkout@v4
        with:
          ref: virtual-breadboard-bjt-support
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run test:bjt
