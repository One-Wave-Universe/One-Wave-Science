[project]
name = "onewave-mapper"
version = "0.1.0"
description = "One-Wave Mapper prototype DSP engine (Section 3.3 prototype stack)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "PySide6>=6.5",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
hardware = ["sounddevice>=0.4"]
dev = ["pytest>=7.0"]

[project.scripts]
onewave-mapper = "onewave_mapper.gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
