build_versions:
  programmable_version:
    name: Programmable State-Machine Reference
    role: "Runs, inspects, and validates the same structure intended for the actual primitive build."
    contains:
      - canonical primitive nodes
      - separate 3-and-5 scaling axes
      - state and transition graph
      - Field lifecycle
      - Step-6 evaluation
      - receipts and telemetry
      - anti-drift validator
    completion:
      - all five primitive stages represented
      - three-part and five-part scaling represented independently
      - coupling between 3 and 5 observable without assuming its cause
      - legal inputs and outputs explicit
      - transitions executable
      - invalid transitions rejected
      - result retained as next reference
      - output traceable by receipt
  actual_primitive_version:
    name: Actual Primitive Build
    exact_ladder:
      1: Scalar
      2: Differential
      3: Vector
      4: Tensor
      5: Harmonic
    scaling:
      cadences: [3, 5]
      cause: UNRESOLVED
      required_observation: "Record where each cadence appears and how they couple."
    completion:
      - each primitive has a measurable input
      - each primitive has a measurable state or relation
      - each primitive has a measurable output
      - each primitive feeds the next without changing the ladder
      - three-part and five-part scaling can be distinguished in measurements
      - harmonic output can close or reinject as the next reference
      - bench receipts distinguish observed behavior from architecture
relationship:
  rule: "The programmable version is the testable map of the actual primitive build, not a different machine."
  state_machine_role: "Controls and observes movement through the primitive ladder and its 3/5 scaling."
  lifecycle_role: "Describes the Field-side behavioral phase; it is not the primitive ladder or either scaling cadence."
  anti_drift_rule: "Software names, order, interfaces, transitions, and separate 3/5 cadences must remain aligned with the actual build."
current_status:
  structure_named: true
  three_and_five_scaling_observed: true
  scaling_cause_validated: false
  programmable_primitive_nodes_complete: false
  physical_primitive_contracts_complete: false
  bench_validation_complete: false
next_work_order:
  - Scalar primitive contract
  - Differential primitive contract
  - Vector primitive contract
  - Tensor primitive contract
  - Harmonic primitive contract
  - identify every three-part scaling location
  - identify every five-part scaling location
  - connect five primitive nodes into programmable graph
  - test 3/5 coupling without presuming cause
  - attach Field lifecycle and Step-6 routing
  - issue bench-test packets and receipts
