<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<title id="title">Idealized six-neighbor cellular map</title>
<desc id="desc">One center cell with six equal planar neighbor slots, shown as an addressing diagram rather than literal cell anatomy.</desc>
<rect width="960" height="640" fill="white"/>
<g stroke="#20242a" stroke-width="4" fill="none">
  <line x1="480" y1="320" x2="480" y2="120"/>
  <line x1="480" y1="320" x2="653" y2="220"/>
  <line x1="480" y1="320" x2="653" y2="420"/>
  <line x1="480" y1="320" x2="480" y2="520"/>
  <line x1="480" y1="320" x2="307" y2="420"/>
  <line x1="480" y1="320" x2="307" y2="220"/>
</g>
<g fill="#f5f5f5" stroke="#20242a" stroke-width="4">
  <circle cx="480" cy="320" r="72"/><circle cx="480" cy="120" r="62"/>
  <circle cx="653" cy="220" r="62"/><circle cx="653" cy="420" r="62"/>
  <circle cx="480" cy="520" r="62"/><circle cx="307" cy="420" r="62"/><circle cx="307" cy="220" r="62"/>
</g>
<g font-family="Arial, sans-serif" text-anchor="middle" fill="#111">
  <text x="480" y="330" font-size="28" font-weight="bold">C0</text>
  <text x="480" y="130" font-size="24">C1</text><text x="653" y="230" font-size="24">C2</text>
  <text x="653" y="430" font-size="24">C3</text><text x="480" y="530" font-size="24">C4</text>
  <text x="307" y="430" font-size="24">C5</text><text x="307" y="230" font-size="24">C6</text>
  <text x="480" y="604" font-size="20">Six equal neighbor addresses — topology diagram, not literal cell shape</text>
</g>
</svg>