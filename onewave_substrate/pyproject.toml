[project]
name = "onewave-substrate"
version = "0.1.0"
description = "Generative, field-aware relational knowledge substrate (Phase 1 Python reference implementation)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["onewave*"]
