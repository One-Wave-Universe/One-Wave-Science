<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>One-Wave hex</title>
<style>
body{margin:0;background:#1a140e;color:#f0d5a8;font-family:sans-serif;text-align:center;padding:24px}
svg{width:min(90vw,420px);height:auto}
button{margin:6px;padding:10px 14px;background:#2a2118;color:#f0d5a8;border:1px solid #6a4e2a}
#read{margin-top:12px}
</style>
</head>
<body>
<h1>One-Wave seven-cell</h1>
<p>If you can read this heading, the page loaded.</p>
<svg id="s" viewBox="0 0 200 200">
  <polygon id="poly" points="100,20 160,55 160,125 100,160 40,125 40,55" fill="none" stroke="#c9a36a" stroke-width="2"/>
  <g id="spokes"></g>
  <circle id="core" cx="100" cy="90" r="8" fill="#edd5a8"/>
</svg>
<div>
  <button type="button" id="in">Inward</button>
  <button type="button" id="out">Outward</button>
  <button type="button" id="across">Across</button>
  <button type="button" id="over">Over</button>
  <button type="button" id="rest">Hold</button>
</div>
<div id="read"></div>
<script>
const pos=[
  [100,20],[160,55],[160,125],[100,160],[40,125],[40,55]
];
const spokes=document.getElementById('spokes');
const dots=[];
pos.forEach(([x,y])=>{
  const l=document.createElementNS('http://www.w3.org/2000/svg','line');
  l.setAttribute('x1','100');l.setAttribute('y1','90');
  l.setAttribute('x2',x);l.setAttribute('y2',y);
  l.setAttribute('stroke','#6a4e2a');
  spokes.appendChild(l);
  const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
  c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r','6');c.setAttribute('fill','#7a5a30');
  spokes.appendChild(c); dots.push(c);
});
let ac=1, ar=Array(6).fill(1), action='rest';
['in','out','across','over','rest'].forEach(id=>{
  document.getElementById(id).onclick=()=>action=id;
});
let t=0;
function dipole(){
  let C=0,S=0;
  ar.forEach((a,k)=>{C+=a*Math.cos(k*Math.PI/3);S+=a*Math.sin(k*Math.PI/3);});
  return Math.atan2(S,C);
}
function energy(){
  const th=dipole();
  const R=(ar.reduce((s,v)=>s+v,0)/6)/(ac+1e-9);
  const eK=0.4*ar.reduce((s,a,i)=>s+(a-ar[(i+1)%6])**2,0);
  const eE=(R-1)**2+0.5*(ac-1)**2;
  const eM=0.35*Math.sin(th)**2;
  const eT=0.8*(R-1)**2+0.2*ar.reduce((s,a)=>s+(a-ac)**2,0);
  return {tot:eK+eE+eM+eT,R,th};
}
function loop(){
  if(action==='in'){ac=Math.min(1.4,ac+0.01); ar=ar.map(a=>Math.max(0.6,a-0.008));}
  if(action==='out'){ac=Math.max(0.7,ac-0.01); ar=ar.map(a=>Math.min(1.4,a+0.008));}
  if(action==='across'){t+=0.04; ar=ar.map((a,i)=>1+0.08*Math.sin(t+i*Math.PI));}
  if(action==='over'){
    const tgt=Math.abs(dipole())<Math.PI/2?Math.PI:0;
    ar=ar.map((a,i)=>a+0.02*Math.cos(i*Math.PI/3+tgt)-0.01*(a-1));
  }
  if(action==='rest'){ac+=(1-ac)*0.08; ar=ar.map(a=>a+(1-a)*0.08);}
  document.getElementById('core').setAttribute('r', String(8+12*(ac-0.7)));
  dots.forEach((c,i)=>{c.setAttribute('r', String(5+10*(ar[i]-0.6))); c.setAttribute('fill', ar[i]>1.05?'#f0c36a':'#7a5a30');});
  const e=energy();
  document.getElementById('read').textContent='E='+e.tot.toFixed(3)+'  R='+e.R.toFixed(3)+'  theta='+e.th.toFixed(2);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
