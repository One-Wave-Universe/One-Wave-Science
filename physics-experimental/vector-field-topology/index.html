<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One-Wave Vector Field Topology Lab</title>
<style>
:root{--bg:#020409;--p:#09111aee;--l:#263844;--i:#effaff;--m:#91a8b8;--c:#78e7f2;--a:#f2bd63;--g:#7de0a7;--r:#f07872;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--i);overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;background:radial-gradient(circle at 50% 45%,#10232d,#020409 60%,#000)}.ui{position:fixed;inset:0;display:grid;grid-template-columns:270px 1fr 290px;gap:10px;padding:10px;pointer-events:none}.panel{pointer-events:auto;background:var(--p);border:1px solid var(--l);border-radius:16px;overflow:auto;padding:14px;backdrop-filter:blur(14px)}.stage{position:relative}.brand{font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.sub,.copy{font-size:10px;color:var(--m);line-height:1.5}.scene{padding:9px;border:1px solid #1c2933;border-radius:10px;margin:6px 0;background:#070c12bd;cursor:pointer}.scene.on,.scene:hover{border-color:var(--c)}.scene strong{font-size:10.5px;display:block}.scene small{font-size:9px;color:var(--m)}.tools{pointer-events:auto;position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:#071018d6;border:1px solid var(--l);padding:6px;border-radius:999px}.btn{border:1px solid #354652;background:#101a22;color:var(--i);padding:8px 11px;border-radius:999px;font-size:11px;cursor:pointer}.btn:hover{border-color:var(--c)}.title{position:absolute;left:24px;bottom:28px;font-size:clamp(30px,5vw,66px);font-weight:760;letter-spacing:-.05em;text-shadow:0 3px 28px #000}.title small{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#bdced8}.card{border-top:1px solid #1d2b34;padding:12px 0}.card:first-child{border-top:0;padding-top:0}.row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 0;border-bottom:1px solid #16232b;font-size:10px}.row span{color:var(--m)}.good{color:var(--g)}.warn{color:var(--a)}.bad{color:var(--r)}.slider{margin:10px 0}.slider label{display:flex;justify-content:space-between;font-size:10px;color:var(--m);margin-bottom:4px}.slider input{width:100%;accent-color:var(--c)}@media(max-width:1000px){.ui{grid-template-columns:230px 1fr}.right{display:none}}@media(max-width:700px){body{overflow:auto}.ui{position:relative;display:block}.panel{margin-bottom:8px}.stage{min-height:65vh}}
</style></head><body><canvas id="cv"></canvas><div class="ui"><aside class="panel"><div class="brand">Vector Field Topology Lab</div><div class="sub">Divergence · curl · sources · vortices · dipoles · superposition.</div><div id="list"></div></aside><main class="stage"><div class="tools"><button class="btn" id="reset">Reset</button><button class="btn" id="perturb">Perturb</button></div><div class="title"><small id="kicker"></small><span id="name"></span></div></main><aside class="panel right"><div class="card"><h2 id="status"></h2><div class="copy" id="copy"></div></div><div class="card"><h2>Live diagnostics</h2><div id="diag"></div></div><div class="card"><h2>Parameters</h2><div class="slider"><label><span>Strength</span><b id="ao"></b></label><input id="a" type="range" min=".1" max="3" value="1" step=".01"></div><div class="slider"><label><span>Scale / separation</span><b id="bo"></b></label><input id="b" type="range" min=".15" max="2" value=".8" step=".01"></div><button class="btn" id="export">Export CSV</button></div><div class="card"><h2>Control rule</h2><div class="copy">Finite-difference divergence and curl are measured on the rendered analytic field. No One-Wave law is assumed.</div></div></aside></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),c=$('cv'),g=c.getContext('2d',{alpha:false});let W,H,D=1,si=0,s,rows=[];const U={list:$('list'),reset:$('reset'),perturb:$('perturb'),name:$('name'),kicker:$('kicker'),status:$('status'),copy:$('copy'),diag:$('diag'),a:$('a'),b:$('b'),ao:$('ao'),bo:$('bo'),export:$('export')};
const S=[['uniform','Uniform Field','Control · zero div/curl','Uniform vector control','Constant field: divergence = 0 and curl = 0.'],['source','Radial Source','Control · source topology','Source-field control','Outward radial field with positive divergence concentrated near the origin.'],['vortex','Vortex','Control · rotational topology','Vortex-field control','Tangential field with curl and near-zero divergence away from the softened core.'],['saddle','Saddle','Control · shear topology','Linear saddle control','F=(x,-y): zero divergence and zero scalar curl, but nontrivial deformation.'],['dipole','Dipole Pair','Control · source/sink pair','Dipole topology control','Superposed softened source and sink separated along x.'],['mix','Source + Vortex','Control · superposition','Mixed topology control','Linear superposition exposes simultaneous divergence and curl.']];
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';g.setTransform(D,0,0,D,0,0);draw()}addEventListener('resize',resize);resize();
const fmt=(x,n=4)=>Number.isFinite(x)?(Math.abs(x)&&Math.abs(x)<1e-4?x.toExponential(2):x.toFixed(n)):'—',clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function field(x,y){let A=+U.a.value,B=+U.b.value,e=.06*B*B;if(s[0]==='uniform')return[A,0];if(s[0]==='source'){let r2=x*x+y*y+e,k=A/Math.sqrt(r2);return[k*x,k*y]}if(s[0]==='vortex'){let r2=x*x+y*y+e,k=A/r2;return[-k*y,k*x]}if(s[0]==='saddle')return[A*x,-A*y];if(s[0]==='dipole'){let d=.45*B,one=(cx,sgn)=>{let X=x-cx,r2=X*X+y*y+e,k=sgn*A/Math.pow(r2,1.5);return[k*X,k*y]},p=one(-d,1),q=one(d,-1);return[p[0]+q[0],p[1]+q[1]]}let r2=x*x+y*y+e,ks=A/Math.sqrt(r2),kv=.55*A/r2;return[ks*x-kv*y,ks*y+kv*x]}
function divcurl(x,y){let h=.006,fx1=field(x+h,y),fx0=field(x-h,y),fy1=field(x,y+h),fy0=field(x,y-h);return[(fx1[0]-fx0[0])/(2*h)+(fy1[1]-fy0[1])/(2*h),(fx1[1]-fx0[1])/(2*h)-(fy1[0]-fy0[0])/(2*h)]}
function menu(){U.list.innerHTML=S.map((q,i)=>`<div class="scene ${i===si?'on':''}" data-i="${i}"><strong>${q[1]}</strong><small>${q[2]}</small></div>`).join('');U.list.querySelectorAll('.scene').forEach(e=>e.onclick=()=>set(+e.dataset.i))}
function set(i){si=i;s=S[i];menu();U.name.textContent=s[1];U.kicker.textContent=s[2];U.status.textContent=s[3];U.copy.textContent=s[4];rows=[];out();draw()}
function stats(){let sd=0,sc=0,md=0,mc=0,n=0;for(let j=0;j<24;j++)for(let i=0;i<32;i++){let x=-1.4+2.8*(i+.5)/32,y=-1+2*(j+.5)/24;if(Math.hypot(x,y)<.12)continue;let [d,c0]=divcurl(x,y);sd+=Math.abs(d);sc+=Math.abs(c0);md=Math.max(md,Math.abs(d));mc=Math.max(mc,Math.abs(c0));n++}return{meanDiv:sd/n,meanCurl:sc/n,maxDiv:md,maxCurl:mc}}
function draw(){if(!s)return;g.fillStyle='#020409';g.fillRect(0,0,W,H);let cols=34,rowsN=24,ox=W*.12,oy=H*.2,ww=W*.76,hh=H*.55;for(let j=0;j<rowsN;j++)for(let i=0;i<cols;i++){let x=-1.5+3*(i+.5)/cols,y=1.05-2.1*(j+.5)/rowsN,v=field(x,y),m=Math.hypot(...v),len=Math.min(15,3+5*Math.log1p(m)),px=ox+ww*(i+.5)/cols,py=oy+hh*(j+.5)/rowsN,ux=v[0]/(m||1),uy=-v[1]/(m||1);g.strokeStyle=`rgba(${120+Math.min(120,m*18)},220,242,.72)`;g.beginPath();g.moveTo(px-ux*len*.5,py-uy*len*.5);g.lineTo(px+ux*len*.5,py+uy*len*.5);g.stroke();g.fillStyle='#78e7f2';g.beginPath();g.arc(px+ux*len*.5,py+uy*len*.5,1.2,0,7);g.fill()}}
function diagnostics(){let q=stats();return[['mean |div|',fmt(q.meanDiv,5),q.meanDiv<.02?'good':q.meanDiv<.3?'warn':'bad'],['mean |curl|',fmt(q.meanCurl,5),q.meanCurl<.02?'good':q.meanCurl<.3?'warn':'bad'],['max |div|',fmt(q.maxDiv,4)],['max |curl|',fmt(q.maxCurl,4)]]}
function read(){U.diag.innerHTML=diagnostics().map(q=>`<div class="row"><span>${q[0]}</span><b class="${q[2]||''}">${q[1]}</b></div>`).join('')}
function record(){let o={scene:s[0],strength:+U.a.value,scale:+U.b.value,solver_affects_hypothesis:false};diagnostics().forEach(q=>o[q[0].toLowerCase().replace(/[^a-z0-9]+/g,'_')]=q[1]);rows.push(o)}
function out(){U.ao.textContent=(+U.a.value).toFixed(2);U.bo.textContent=(+U.b.value).toFixed(2);read();draw()}
U.reset.onclick=()=>{U.a.value=1;U.b.value=.8;out()};U.perturb.onclick=()=>{U.a.value=clamp(+U.a.value+(Math.random()-.5)*.4,.1,3);U.b.value=clamp(+U.b.value+(Math.random()-.5)*.25,.15,2);out()};U.a.oninput=out;U.b.oninput=out;U.export.onclick=()=>{record();let ks=Object.keys(rows[0]),Q=v=>'"'+String(v??'').replaceAll('"','""')+'"',csv=[ks.join(','),...rows.map(r=>ks.map(k=>Q(r[k])).join(','))].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`field_${s[0]}.csv`;a.click()};set(0);
})();
</script></body></html>
