<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One-Wave Integral Field Theorem Lab</title>
<style>:root{--bg:#020409;--p:#09111aee;--l:#263844;--i:#effaff;--m:#91a8b8;--c:#78e7f2;--a:#f2bd63;--g:#7de0a7;--r:#f07872;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--i);overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;background:radial-gradient(circle at 50% 42%,#10232d,#020409 60%,#000)}.ui{position:fixed;inset:0;display:grid;grid-template-columns:260px 1fr 300px;gap:10px;padding:10px;pointer-events:none}.panel{pointer-events:auto;background:var(--p);border:1px solid var(--l);border-radius:16px;padding:14px;overflow:auto}.stage{position:relative}.brand{font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.sub,.copy{font-size:10px;color:var(--m);line-height:1.5}.scene{padding:9px;border:1px solid #1c2933;border-radius:10px;margin:6px 0;background:#070c12bd;cursor:pointer}.scene.on,.scene:hover{border-color:var(--c)}.scene strong{display:block;font-size:10.5px}.scene small{font-size:9px;color:var(--m)}.title{position:absolute;left:24px;bottom:28px;font-size:clamp(30px,5vw,66px);font-weight:760;letter-spacing:-.05em;text-shadow:0 3px 28px #000}.title small{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#bdced8}.row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:7px 0;border-bottom:1px solid #16232b;font-size:10px}.row span{color:var(--m)}.good{color:var(--g)}.warn{color:var(--a)}.bad{color:var(--r)}.slider{margin:10px 0}.slider label{display:flex;justify-content:space-between;font-size:10px;color:var(--m);margin-bottom:4px}.slider input{width:100%;accent-color:var(--c)}.btn{border:1px solid #354652;background:#101a22;color:var(--i);padding:8px 11px;border-radius:999px;font-size:11px;cursor:pointer}.btn:hover{border-color:var(--c)}@media(max-width:980px){.ui{grid-template-columns:220px 1fr}.right{display:none}}@media(max-width:700px){body{overflow:auto}.ui{position:relative;display:block}.panel{margin-bottom:8px}.stage{min-height:65vh}}</style></head><body><canvas id="cv"></canvas><div class="ui"><aside class="panel"><div class="brand">Integral Field Theorem Lab</div><div class="sub">Local derivatives cross-checked against boundary integrals.</div><div id="list"></div></aside><main class="stage"><div class="title"><small id="kicker"></small><span id="name"></span></div></main><aside class="panel right"><div class="copy" id="copy"></div><div id="diag"></div><div class="slider"><label><span>Region half-size</span><b id="lo"></b></label><input id="L" type="range" min=".3" max="1.6" value="1" step=".01"></div><div class="slider"><label><span>Resolution</span><b id="no"></b></label><input id="N" type="range" min="20" max="140" value="80" step="2"></div><button class="btn" id="export">Export CSV</button></aside></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),c=$('cv'),g=c.getContext('2d',{alpha:false});let W,H,D=1,si=0,s,rows=[];const U={list:$('list'),name:$('name'),kicker:$('kicker'),copy:$('copy'),diag:$('diag'),L:$('L'),N:$('N'),lo:$('lo'),no:$('no'),export:$('export')};const S=[['linear','Linear Expansion','Control · divergence theorem','F=(x,y)','Constant positive divergence, zero curl.'],['vortex','Solid Rotation','Control · Green/Stokes','F=(-y,x)','Zero divergence, constant positive curl.'],['saddle','Saddle','Control · zero integrals','F=(x,-y)','Both total flux and circulation should vanish on a centered square.'],['mixed','Mixed Linear Field','Control · simultaneous checks','F=(x-y,x+y)','Nonzero divergence and curl tested at the same time.']];
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';g.setTransform(D,0,0,D,0,0);draw()}addEventListener('resize',resize);resize();const fmt=(x,n=7)=>Number.isFinite(x)?(Math.abs(x)&&Math.abs(x)<1e-6?x.toExponential(2):x.toFixed(n)):'—';
function field(x,y){if(s[0]==='linear')return[x,y];if(s[0]==='vortex')return[-y,x];if(s[0]==='saddle')return[x,-y];return[x-y,x+y]}
function deriv(x,y,h=1e-5){let xp=field(x+h,y),xm=field(x-h,y),yp=field(x,y+h),ym=field(x,y-h);let div=(xp[0]-xm[0])/(2*h)+(yp[1]-ym[1])/(2*h),curl=(xp[1]-xm[1])/(2*h)-(yp[0]-ym[0])/(2*h);return[div,curl]}
function calc(){let L=+U.L.value,N=+U.N.value,dx=2*L/N,areaDiv=0,areaCurl=0;for(let j=0;j<N;j++)for(let i=0;i<N;i++){let x=-L+(i+.5)*dx,y=-L+(j+.5)*dx,[d,c0]=deriv(x,y);areaDiv+=d*dx*dx;areaCurl+=c0*dx*dx}
let flux=0,circ=0,ds=2*L/N;for(let i=0;i<N;i++){let u=-L+(i+.5)*ds;let f=field(L,u);flux+=f[0]*ds;circ+=f[1]*ds;f=field(-L,u);flux-=f[0]*ds;circ-=f[1]*ds;f=field(u,L);flux+=f[1]*ds;circ-=f[0]*ds;f=field(u,-L);flux-=f[1]*ds;circ+=f[0]*ds}
return{areaDiv,areaCurl,flux,circ,fluxResidual:flux-areaDiv,circResidual:circ-areaCurl}}
function menu(){U.list.innerHTML=S.map((q,i)=>`<div class="scene ${i===si?'on':''}" data-i="${i}"><strong>${q[1]}</strong><small>${q[2]}</small></div>`).join('');U.list.querySelectorAll('.scene').forEach(e=>e.onclick=()=>set(+e.dataset.i))}
function set(i){si=i;s=S[i];menu();U.name.textContent=s[1];U.kicker.textContent=s[2];U.copy.textContent=s[3]+' — '+s[4];rows=[];out()}
function diagnostics(){let q=calc(),fr=Math.abs(q.fluxResidual),cr=Math.abs(q.circResidual);return[['boundary flux',fmt(q.flux)],['area ∫div',fmt(q.areaDiv)],['flux residual',fmt(q.fluxResidual),fr<1e-5?'good':fr<1e-3?'warn':'bad'],['boundary circulation',fmt(q.circ)],['area ∫curl',fmt(q.areaCurl)],['circulation residual',fmt(q.circResidual),cr<1e-5?'good':cr<1e-3?'warn':'bad']]}
function read(){U.diag.innerHTML=diagnostics().map(q=>`<div class="row"><span>${q[0]}</span><b class="${q[2]||''}">${q[1]}</b></div>`).join('')}
function draw(){if(!s)return;g.fillStyle='#020409';g.fillRect(0,0,W,H);let L=+U.L.value,Nv=22,ox=W*.17,oy=H*.2,ww=W*.66,hh=H*.55;for(let j=0;j<Nv;j++)for(let i=0;i<Nv;i++){let x=-L+2*L*(i+.5)/Nv,y=L-2*L*(j+.5)/Nv,v=field(x,y),m=Math.hypot(...v),ux=v[0]/(m||1),uy=-v[1]/(m||1),px=ox+ww*(i+.5)/Nv,py=oy+hh*(j+.5)/Nv,len=Math.min(14,4+m*5);g.strokeStyle='rgba(120,231,242,.65)';g.beginPath();g.moveTo(px-ux*len*.5,py-uy*len*.5);g.lineTo(px+ux*len*.5,py+uy*len*.5);g.stroke()}g.strokeStyle='#f2bd63';g.strokeRect(ox,oy,ww,hh)}
function out(){U.lo.textContent=(+U.L.value).toFixed(2);U.no.textContent=U.N.value;read();draw()}U.L.oninput=out;U.N.oninput=out;U.export.onclick=()=>{let q=calc(),o={scene:s[0],region_half_size:+U.L.value,resolution:+U.N.value,solver_affects_hypothesis:false,...q};rows.push(o);let ks=Object.keys(o),Q=v=>'"'+String(v??'').replaceAll('"','""')+'"',csv=[ks.join(','),...rows.map(r=>ks.map(k=>Q(r[k])).join(','))].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`integral_${s[0]}.csv`;a.click()};set(0);
})();
</script></body></html>
