<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One-Wave Maxwell Control Lab</title>
<style>:root{--bg:#020409;--p:#09111aee;--l:#263844;--i:#effaff;--m:#91a8b8;--c:#78e7f2;--a:#f2bd63;--g:#7de0a7;--r:#f07872;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--i);overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;background:radial-gradient(circle at 50% 45%,#10242e,#020409 60%,#000)}.ui{position:fixed;inset:0;display:grid;grid-template-columns:260px 1fr 300px;gap:10px;padding:10px;pointer-events:none}.panel{pointer-events:auto;background:var(--p);border:1px solid var(--l);border-radius:16px;padding:14px;overflow:auto}.stage{position:relative}.brand{font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.sub,.copy{font-size:10px;color:var(--m);line-height:1.5}.scene{padding:9px;border:1px solid #1c2933;border-radius:10px;margin:6px 0;background:#070c12bd;cursor:pointer}.scene.on,.scene:hover{border-color:var(--c)}.scene strong{display:block;font-size:10.5px}.scene small{font-size:9px;color:var(--m)}.title{position:absolute;left:24px;bottom:28px;font-size:clamp(30px,5vw,64px);font-weight:760;letter-spacing:-.05em;text-shadow:0 3px 28px #000}.title small{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#bdced8}.row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:7px 0;border-bottom:1px solid #16232b;font-size:10px}.row span{color:var(--m)}.good{color:var(--g)}.warn{color:var(--a)}.slider{margin:10px 0}.slider label{display:flex;justify-content:space-between;font-size:10px;color:var(--m);margin-bottom:4px}.slider input{width:100%;accent-color:var(--c)}.btn{border:1px solid #354652;background:#101a22;color:var(--i);padding:8px 11px;border-radius:999px;font-size:11px;cursor:pointer}@media(max-width:980px){.ui{grid-template-columns:220px 1fr}.right{display:none}}@media(max-width:700px){body{overflow:auto}.ui{position:relative;display:block}.panel{margin-bottom:8px}.stage{min-height:65vh}}</style></head><body><canvas id="cv"></canvas><div class="ui"><aside class="panel"><div class="brand">Maxwell Control Lab</div><div class="sub">Normalized EM controls. Standard identities first.</div><div id="list"></div></aside><main class="stage"><div class="title"><small id="kicker"></small><span id="name"></span></div></main><aside class="panel right"><div class="copy" id="copy"></div><div id="diag"></div><div class="slider"><label><span>Amplitude</span><b id="ao"></b></label><input id="a" type="range" min=".2" max="2" value="1" step=".01"></div><div class="slider"><label><span>Frequency / radius</span><b id="bo"></b></label><input id="b" type="range" min=".2" max="2" value="1" step=".01"></div><button class="btn" id="export">Export CSV</button></aside></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),c=$('cv'),g=c.getContext('2d',{alpha:false});let W,H,D=1,t=0,last=performance.now(),si=0,s,rows=[];const U={list:$('list'),name:$('name'),kicker:$('kicker'),copy:$('copy'),diag:$('diag'),a:$('a'),b:$('b'),ao:$('ao'),bo:$('bo'),export:$('export')};const S=[['gausse','Gauss Electric','Control · inverse-square flux','Normalized point-charge field: E∝1/r² and spherical flux stays constant.'],['gaussb','Gauss Magnetic','Control · div B = 0','Softened circulating magnetic field: divergence is checked away from the core.'],['faraday','Faraday Induction','Control · curl E = -∂B/∂t','Time-varying uniform B through a circular loop gives induced EMF = -area·dB/dt.'],['ampere','Ampère Circulation','Control · ∮B·dl ∝ I','Normalized straight-current field Bθ∝1/r gives radius-independent circulation.'],['plane','Plane EM Wave','Control · E ⟂ B ⟂ k','Normalized plane wave checks orthogonality and phase locking.'],['poynting','Poynting Flow','Control · S = E × B','Energy-flow vector is calculated from the plane-wave E and B vectors.']];function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();const fmt=(x,n=6)=>Number.isFinite(x)?(Math.abs(x)&&Math.abs(x)<1e-5?x.toExponential(2):x.toFixed(n)):'—';
function menu(){U.list.innerHTML=S.map((q,i)=>`<div class="scene ${i===si?'on':''}" data-i="${i}"><strong>${q[1]}</strong><small>${q[2]}</small></div>`).join('');U.list.querySelectorAll('.scene').forEach(e=>e.onclick=()=>set(+e.dataset.i))}
function set(i){si=i;s=S[i];menu();U.name.textContent=s[1];U.kicker.textContent=s[2];U.copy.textContent=s[3];rows=[];out()}
function gaussE(){let A=+U.a.value,r=.4+.6*+U.b.value,E=A/(4*Math.PI*r*r),area=4*Math.PI*r*r;return{r,E,area,flux:E*area,target:A}}
function gaussB(){let A=+U.a.value,e=.04,h=.002,x=.7,y=.35,field=(x,y)=>{let r2=x*x+y*y+e;return[-A*y/r2,A*x/r2]},xp=field(x+h,y),xm=field(x-h,y),yp=field(x,y+h),ym=field(x,y-h),div=(xp[0]-xm[0])/(2*h)+(yp[1]-ym[1])/(2*h);return{div}}
function faraday(){let A=+U.a.value,w=.5+1.5*+U.b.value,R=.65,B=A*Math.sin(w*t),dB=A*w*Math.cos(w*t),emf=-Math.PI*R*R*dB;return{B,dB,emf,R}}
function ampere(){let I=+U.a.value,r=.35+.65*+U.b.value,B=I/(2*Math.PI*r),circ=B*2*Math.PI*r;return{I,r,B,circ}}
function wave(){let A=+U.a.value,w=.5+1.5*+U.b.value,ph=w*t,E=[0,A*Math.sin(ph),0],B=[0,0,A*Math.sin(ph)],dot=E[0]*B[0]+E[1]*B[1]+E[2]*B[2],S=[E[1]*B[2]-E[2]*B[1],E[2]*B[0]-E[0]*B[2],E[0]*B[1]-E[1]*B[0]];return{E,B,dot,S,w}}
function diagnostics(){if(s[0]==='gausse'){let q=gaussE();return[['radius',fmt(q.r,4)],['E',fmt(q.E)],['flux',fmt(q.flux),Math.abs(q.flux-q.target)<1e-10?'good':'warn'],['target charge',fmt(q.target)]]}if(s[0]==='gaussb'){let q=gaussB();return[['div B sample',fmt(q.div,8),Math.abs(q.div)<1e-5?'good':'warn'],['monopole term','none']]}if(s[0]==='faraday'){let q=faraday();return[['Bz',fmt(q.B)],['dB/dt',fmt(q.dB)],['induced EMF',fmt(q.emf)],['loop radius',fmt(q.R,3)]]}if(s[0]==='ampere'){let q=ampere();return[['radius',fmt(q.r,4)],['Bθ',fmt(q.B)],['circulation',fmt(q.circ),Math.abs(q.circ-q.I)<1e-10?'good':'warn'],['current',fmt(q.I)]]}let q=wave(),Sm=Math.hypot(...q.S);if(s[0]==='plane')return[['E·B',fmt(q.dot,8),Math.abs(q.dot)<1e-10?'good':'warn'],['|E|',fmt(Math.hypot(...q.E))],['|B|',fmt(Math.hypot(...q.B))],['phase locked','yes','good']];return[['Sx',fmt(q.S[0])],['|S|',fmt(Sm)],['E·B',fmt(q.dot,8),Math.abs(q.dot)<1e-10?'good':'warn'],['direction','+x when nonzero']]}
function read(){U.diag.innerHTML=diagnostics().map(q=>`<div class="row"><span>${q[0]}</span><b class="${q[2]||''}">${q[1]}</b></div>`).join('')}
function draw(){g.fillStyle='#020409';g.fillRect(0,0,W,H);let cx=W*.52,cy=H*.46;if(s[0]==='gausse'){let q=gaussE(),R=Math.min(W,H)*.2*q.r;g.strokeStyle='#78e7f2';g.beginPath();g.arc(cx,cy,R,0,7);g.stroke();for(let i=0;i<24;i++){let a=i*Math.PI*2/24;g.strokeStyle='rgba(120,231,242,.65)';g.beginPath();g.moveTo(cx+Math.cos(a)*18,cy+Math.sin(a)*18);g.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);g.stroke()}}else if(s[0]==='gaussb'||s[0]==='ampere'){for(let j=1;j<=6;j++){g.strokeStyle=`rgba(120,231,242,${.7/j+.08})`;g.beginPath();g.arc(cx,cy,j*Math.min(W,H)*.055,0,7);g.stroke()}}else if(s[0]==='faraday'){let q=faraday(),R=Math.min(W,H)*.2;g.strokeStyle='#f2bd63';g.lineWidth=3;g.beginPath();g.arc(cx,cy,R,0,7);g.stroke();g.fillStyle=q.B>=0?'rgba(120,231,242,.25)':'rgba(199,153,255,.25)';g.beginPath();g.arc(cx,cy,R*.9,0,7);g.fill()}else{let q=wave(),N=180;g.strokeStyle='#f07872';g.beginPath();for(let i=0;i<N;i++){let x=i/(N-1),ph=q.w*t-x*12,y=Math.sin(ph),px=W*.14+x*W*.72,py=cy-y*H*.18*(+U.a.value);i?g.lineTo(px,py):g.moveTo(px,py)}g.stroke();g.strokeStyle='#78e7f2';g.beginPath();for(let i=0;i<N;i++){let x=i/(N-1),ph=q.w*t-x*12,y=Math.sin(ph),px=W*.14+x*W*.72,py=cy+y*H*.11*(+U.a.value);i?g.lineTo(px,py):g.moveTo(px,py)}g.stroke()}}
function record(){let o={scene:s[0],time:t.toFixed(5),amplitude:+U.a.value,parameter_b:+U.b.value,solver_affects_hypothesis:false};diagnostics().forEach(q=>o[q[0].toLowerCase().replace(/[^a-z0-9]+/g,'_')]=q[1]);rows.push(o)}
function out(){U.ao.textContent=(+U.a.value).toFixed(2);U.bo.textContent=(+U.b.value).toFixed(2);read();draw()}U.a.oninput=out;U.b.oninput=out;U.export.onclick=()=>{record();let ks=Object.keys(rows[0]),Q=v=>'"'+String(v??'').replaceAll('"','""')+'"',csv=[ks.join(','),...rows.map(r=>ks.map(k=>Q(r[k])).join(','))].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`maxwell_${s[0]}.csv`;a.click()};function loop(now){let dt=Math.min(.035,(now-last)/1000||.016);last=now;t+=dt;read();draw();requestAnimationFrame(loop)}set(0);requestAnimationFrame(loop);
})();
</script></body></html>
