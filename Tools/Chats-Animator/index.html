<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One-Wave Animator A1</title><style>body{margin:0;background:#111;color:#eee;font-family:system-ui}.bar{padding:12px;display:flex;gap:8px}.stage{position:relative;width:min(1200px,100%);aspect-ratio:16/9;margin:auto;background:#050505;overflow:hidden}.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.grid{position:absolute;inset:0;pointer-events:none}.grid svg{width:100%;height:100%}.grid line{stroke:#fff;stroke-opacity:.35}.grid .major{stroke-opacity:.75;stroke-width:2}.status{padding:10px;text-align:center;color:#aaa}button{padding:8px 12px}</style></head><body><div class="bar"><button id="load">Load PNG Background</button><button id="place" disabled>Enter Placement Mode</button><input id="file" type="file" accept="image/png" hidden></div><div class="stage"><img id="bg" hidden><div id="grid" class="grid" hidden></div></div><div id="status" class="status">A1 ready</div><script src="app.js"></script></body></html>
