<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Code by Law Rules</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Code by Law Rules</h1>
        <p>Defaults are built in. Custom rules can add new law or override a default by using the same rule ID.</p>
      </div>
      <div class="actions">
        <button id="add">Add rule</button>
        <button id="export">Export custom rules</button>
        <label class="import">Import JSON<input id="import" type="file" accept="application/json,.json"></label>
      </div>
    </header>

    <section>
      <h2>Default rules</h2>
      <div id="defaults" class="rule-list"></div>
    </section>

    <section>
      <h2>Custom rules</h2>
      <p class="hint">Edit these whenever you want. Saving takes effect on the next governed turn.</p>
      <div id="custom" class="rule-list"></div>
    </section>

    <p id="message" role="status"></p>
  </main>

  <template id="rule-template">
    <article class="rule">
      <div class="row">
        <label>ID<input class="id" type="text"></label>
        <label>Title<input class="title" type="text"></label>
      </div>
      <div class="row small">
        <label>Phase<input class="phase" type="text"></label>
        <label>Priority<input class="priority" type="number"></label>
        <label class="enabled-label"><input class="enabled" type="checkbox"> Enabled</label>
      </div>
      <label>Rule<textarea class="text" rows="4"></textarea></label>
      <div class="rule-actions">
        <button class="save">Save</button>
        <button class="delete">Delete</button>
      </div>
    </article>
  </template>

  <script src="lib/rules.js"></script>
  <script src="options.js"></script>
</body>
</html>
