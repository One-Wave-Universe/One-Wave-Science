<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>D-415 Planetary Point–Path–Field Visual</title>
<style>
:root{color-scheme:dark;--cyan:#6cecff;--gold:#ffd274;--ink:#eaf8ff;--muted:#6f8b9d}*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#020609;color:var(--ink);font-family:Inter,system-ui,sans-serif}.app{height:100vh;display:grid;grid-template-rows:1fr 70px}.stage{display:grid;place-items:center;padding:14px;background:radial-gradient(circle at 50% 42%,#102735 0,#041018 40%,#010406 78%)}
canvas{display:block;width:min(100%,calc((100vh - 98px)*16/9));aspect-ratio:16/9;border:1px solid #183645;border-radius:18px;background:#02070b;box-shadow:0 40px 120px #000d,0 0 80px #31dfff12}.controls{display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid #142b37;background:#071119}.spacer{flex:1}
button,select{height:42px;padding:0 15px;border:1px solid #264655;border-radius:11px;background:#0d1d26;color:var(--ink);font:700 11px Inter,system-ui;letter-spacing:.07em;cursor:pointer}button:hover,select:hover{border-color:#5b91a8}.primary{background:var(--cyan);border-color:var(--cyan);color:#031016}.recording{background:#9f1743;border-color:#ff5a8c;animation:pulse 1s infinite alternate}.note{color:var(--muted);font:500 11px/1.35 ui-monospace,monospace;text-align:right}@keyframes pulse{to{box-shadow:0 0 24px #ff4f8277}}@media(max-width:760px){.note{display:none}.stage{padding:3px}canvas{width:100%;border-radius:6px}.controls{overflow:auto}}
</style></head>
<body><main class="app"><section class="stage"><canvas id="c" width="1920" height="1080"></canvas></section><nav class="controls"><button class="primary" id="play">PAUSE</button><button id="reset">RESET</button><select id="mode"><option value="system">SOL · EARTH · MOON</option><option value="mercury">MERCURY · SOL EM COUPLING</option><option value="venus">VENUS · ASYMMETRIC ROTATION</option><option value="nested">NESTED SOLAR WAKE</option></select><button id="record">RECORD 20s</button><div class="spacer"></div><div class="note">D-415 PLANETARY VISUAL PROJECTION<br>YELLOW · VISUALIZATION IS NOT VALIDATION</div></nav></main>
<script>
(()=>{'use strict';const c=document.querySelector('#c'),x=c.getContext('2d'),mode=document.querySelector('#mode'),play=document.querySelector('#play'),rec=document.querySelector('#record');let t=0,on=true,last=performance.now(),trail=[],moonTrail=[],recorder;const TAU=Math.PI*2;
const state={system:{earth:.1,moon:2.1,solSpin:0},mercury:{mercury:.3,solSpin:0},venus:{venus:2.8,solSpin:0},nested:{earth:.1,galaxy:.5,solSpin:0}};
function reset(){t=0;trail=[];moonTrail=[];Object.assign(state.system,{earth:.1,moon:2.1,solSpin:0});Object.assign(state.mercury,{mercury:.3,solSpin:0});Object.assign(state.venus,{venus:2.8,solSpin:0});Object.assign(state.nested,{earth:.1,galaxy:.5,solSpin:0})}
function step(dt){t+=dt;const s=state[mode.value];s.solSpin+=dt*.22;if(mode.value==='system'){s.earth+=dt*.16;s.moon+=dt*.63}else if(mode.value==='mercury')s.mercury+=dt*.32*(1+.11*Math.sin(t*.7));else if(mode.value==='venus')s.venus-=dt*.045*(1+.18*Math.sin(t*.18));else{s.earth+=dt*.16;s.galaxy+=dt*.018} }
function bg(){const g=x.createLinearGradient(0,0,0,1080);g.addColorStop(0,'#06141d');g.addColorStop(.52,'#020a10');g.addColorStop(1,'#010305');x.fillStyle=g;x.fillRect(0,0,1920,1080);x.globalAlpha=.6;for(let i=0;i<230;i++){const q=(i*947.31)%1920,r=(i*i*71.13)%1080,a=.25+.65*((i*37)%19)/19;x.fillStyle=`rgba(190,230,255,${a})`;x.fillRect(q,r,i%17===0?2:1,i%17===0?2:1)}x.globalAlpha=1}
function warpedGrid(cx,cy,wake){x.save();x.strokeStyle='#17404f';x.lineWidth=1;x.globalAlpha=.48;for(let j=-15;j<=15;j++){x.beginPath();for(let i=0;i<=100;i++){const px=70+i*14.2,base=cy+j*28,dx=px-cx,well=150*Math.exp(-(dx*dx)/(2*260*260))*Math.exp(-Math.abs(j)/7),drag=wake*55*Math.exp(-Math.max(0,dx)/300);const py=base+well-drag;if(i)x.lineTo(px,py);else x.moveTo(px,py)}x.stroke()}for(let i=0;i<=50;i++){x.beginPath();for(let j=-15;j<=15;j++){const px=70+i*28.4,dx=px-cx,well=150*Math.exp(-(dx*dx)/(2*260*260))*Math.exp(-Math.abs(j)/7),py=cy+j*28+well-wake*55*Math.exp(-Math.max(0,dx)/300);if(j>-15)x.lineTo(px,py);else x.moveTo(px,py)}x.stroke()}x.restore()}
function glow(px,py,r,color,a=1){const g=x.createRadialGradient(px,py,0,px,py,r*3);g.addColorStop(0,color);g.addColorStop(.28,color.replace(')',`,${.35*a})`).replace('rgb','rgba'));g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.beginPath();x.arc(px,py,r*3,0,TAU);x.fill()}
function sphere(px,py,r,c1,c2,label,spin=0){x.save();const g=x.createRadialGradient(px-r*.35,py-r*.42,r*.1,px,py,r);g.addColorStop(0,c1);g.addColorStop(.52,c2);g.addColorStop(1,'#020609');x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,TAU);x.fill();x.clip();x.globalAlpha=.24;x.strokeStyle='#fff';x.lineWidth=Math.max(1,r*.035);for(let k=-3;k<=3;k++){x.beginPath();x.ellipse(px,py+k*r*.22,r*1.08,r*.13,spin,0,TAU);x.stroke()}x.restore();x.fillStyle='#dff7ff';x.font='700 12px ui-monospace,monospace';x.fillText(label,px+r+11,py-r-7)}
function shell(px,py,rx,ry,color,phase=0,dashed=false){x.save();x.translate(px,py);x.rotate(phase);x.strokeStyle=color;x.lineWidth=2;x.globalAlpha=.72;if(dashed)x.setLineDash([8,9]);x.beginPath();x.ellipse(0,0,rx,ry,0,0,TAU);x.stroke();x.restore()}
function path(points,color){if(points.length<2)return;x.save();x.strokeStyle=color;x.lineWidth=3;x.globalAlpha=.72;x.beginPath();points.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.stroke();x.restore()}
function wake(cx,cy,len,color){x.save();x.globalCompositeOperation='screen';for(let k=0;k<14;k++){x.strokeStyle=color;x.globalAlpha=.16*(1-k/14);x.lineWidth=2+k*.5;x.beginPath();x.moveTo(cx-k*9,cy);x.bezierCurveTo(cx-len*.28,cy+Math.sin(t*.5+k)*18,cx-len*.66,cy+(k-7)*13,cx-len,cy+(k-7)*22);x.stroke()}x.restore()}
function panel(title,rows){const px=1460,py=118,pw=400,ph=850;x.fillStyle='#06131bcc';x.beginPath();x.roundRect(px,py,pw,ph,18);x.fill();x.strokeStyle='#193a49';x.stroke();x.fillStyle='#7896a7';x.font='700 12px ui-monospace,monospace';x.fillText(title,px+28,py+40);rows.forEach((r,i)=>{const yy=py+88+i*92;x.fillStyle=r[2]||'#dff8ff';x.font='700 14px Inter,system-ui';x.fillText(r[0],px+28,yy);x.fillStyle='#718d9e';x.font='500 12px ui-monospace,monospace';x.fillText(r[1],px+28,yy+27);x.fillStyle='#102c39';x.fillRect(px+28,yy+46,330,6);x.fillStyle=r[2]||'#6cecff';x.fillRect(px+28,yy+46,330*Math.max(0,Math.min(1,r[3]||0)),6)});x.fillStyle='#506b7b';x.font='500 11px ui-monospace,monospace';x.fillText('POINT · PATH · FIELD ROTATION',px+28,py+802)}
function header(name){x.fillStyle='#e8f9ff';x.font='700 26px Inter,system-ui';x.fillText(name,56,56);x.fillStyle='#678596';x.font='600 12px ui-monospace,monospace';x.fillText('ONE CONTINUOUS FIELD  ·  t '+t.toFixed(2)+'  ·  BEGIN / BUILD / HOLD / BUILD / BREAK / LOOP',56,83)}
function system(){const cx=570+45*Math.sin(t*.025),cy=545,earthA=state.system.earth,ex=cx+510*Math.cos(earthA),ey=cy+285*Math.sin(earthA),ma=state.system.moon,mx=ex+68*Math.cos(ma),my=ey+40*Math.sin(ma);warpedGrid(cx,cy,.5);wake(cx,cy,440,'rgba(80,205,255,.7)');shell(cx,cy,520,288,'#1f6278',earthA*.08,true);trail.push([ex,ey]);moonTrail.push([mx,my]);if(trail.length>230)trail.shift();if(moonTrail.length>230)moonTrail.shift();path(trail,'#68eaff');path(moonTrail,'#c3e8ff');glow(cx,cy,92,'rgb(255,191,70)');sphere(cx,cy,82,'#fff7c4','#f59b28','SOL',state.system.solSpin);shell(cx,cy,145,58,'#ffc55d',state.system.solSpin);glow(ex,ey,38,'rgb(67,160,255)');sphere(ex,ey,31,'#b9efff','#2166a5','EARTH',t*.7);shell(ex,ey,55,21,'#72eaff',-.35);sphere(mx,my,11,'#f4f1e7','#777b82','MOON',t*.3);panel('SOL–EARTH–MOON RECEIPT',[['SOL FIELD ROTATION','moving parent curvature','#ffc95f',.76],['EARTH PATH ROTATION','measured nested path','#6cecff',.64],['EARTH EM SHELL','core / shell coupling','#79f0ff',.58],['MOON RELATION','path within Earth field','#d7e8ef',.43],['GLOBAL LOCK','bounded / unresolved','#ffca73',.29]])}
function mercury(){const cx=620,cy=545,a=state.mercury.mercury,mx=cx+430*Math.cos(a),my=cy+235*Math.sin(a),couple=.5+.5*Math.cos(a-state.mercury.solSpin);warpedGrid(cx,cy,.7);wake(cx,cy,470,'rgba(86,211,255,.7)');shell(cx,cy,440,240,'#204f62',0,true);trail.push([mx,my]);if(trail.length>250)trail.shift();path(trail,'#ffa862');glow(cx,cy,95,'rgb(255,190,62)');sphere(cx,cy,84,'#fff8c8','#f49d24','SOL',state.mercury.solSpin);shell(cx,cy,166,64,'#ffd268',state.mercury.solSpin);glow(mx,my,26,'rgb(255,153,84)');sphere(mx,my,23,'#e9c4a2','#765442','MERCURY',t*1.2);shell(mx,my,43+12*couple,16+5*couple,'#ff9e68',a);x.strokeStyle=`rgba(255,180,96,${.2+.55*couple})`;x.lineWidth=2;x.beginPath();x.moveTo(cx,cy);x.quadraticCurveTo((cx+mx)/2,Math.min(cy,my)-100,mx,my);x.stroke();panel('MERCURY / SOL COUPLING',[['SOL FIELD','parent magnetic rotation','#ffd268',.81],['MERCURY POINT','core / body rotation','#ffad73',.62],['MERCURY PATH','eccentric phase response','#ffa05e',.74],['EM BOUNDARY','relative alignment','#7eeaff',couple],['LOCK STATE','candidate coupling','#ffca73',couple*.66]])}
function venus(){const cx=620,cy=545,a=state.venus.venus,vx=cx+500*Math.cos(a),vy=cy+270*Math.sin(a),mismatch=.55+.35*Math.sin(t*.21);warpedGrid(cx,cy,.58);wake(cx,cy,430,'rgba(88,210,255,.65)');trail.push([vx,vy]);if(trail.length>250)trail.shift();path(trail,'#ffd17a');glow(cx,cy,94,'rgb(255,190,64)');sphere(cx,cy,83,'#fff8c8','#f19a25','SOL',state.venus.solSpin);shell(cx,cy,155,60,'#ffd268',state.venus.solSpin);glow(vx,vy,34,'rgb(255,202,104)');sphere(vx,vy,31,'#fff0b3','#9c6527','VENUS',-t*.12);shell(vx,vy,61,18,'#f6ce78',-a,true);shell(vx+12,vy-4,48,14,'#70dfff',a*.3,true);panel('VENUS ASYMMETRIC RESPONSE',[['BODY ROTATION','slow retrograde Point','#ffd078',.28],['PATH ROTATION','Sol-relative trajectory','#ffb65f',.66],['INDUCED SHELL','Sol-driven response','#6cecff',.42],['ROTATION MISMATCH','Point / Path / Field','#ff779f',mismatch],['LOCK STATE','limping / unresolved','#ffca73',.18]])}
function nested(){const cx=690+120*Math.sin(state.nested.galaxy),cy=545+55*Math.cos(state.nested.galaxy),a=state.nested.earth,ex=cx+380*Math.cos(a),ey=cy+215*Math.sin(a);warpedGrid(cx,cy,1);wake(cx,cy,600,'rgba(79,211,255,.75)');for(let k=1;k<5;k++)shell(cx-k*90,cy+(k-2)*18,170+k*85,55+k*24,`rgba(70,180,225,${.38-k*.045})`,.12*k,true);trail.push([ex,ey]);if(trail.length>250)trail.shift();path(trail,'#6cecff');glow(cx,cy,92,'rgb(255,190,62)');sphere(cx,cy,80,'#fff5bf','#ed9222','SOL',state.nested.solSpin);sphere(ex,ey,28,'#b9efff','#2166a5','EARTH',t*.7);panel('NESTED POINT–PATH–FIELD',[['MACRO WAKE','parent curvature inheritance','#75dfff',.78],['SOL POINT','moving local center','#ffd268',.72],['SOL PATH','galactic inherited motion','#a69bff',.58],['PLANET FIELD','child contribution / return','#6cecff',.49],['NESTED ROTATION','one Field, many strata','#ffca73',.69]])}
function draw(){bg();const m=mode.value;if(m==='system'){header('PLANETARY POINT–PATH–FIELD');system()}else if(m==='mercury'){header('MERCURY COUPLED TO SOL');mercury()}else if(m==='venus'){header('VENUS ROTATIONAL MISMATCH');venus()}else{header('NESTED MOVING CURVATURE');nested()}x.strokeStyle='#183746';x.strokeRect(45.5,107.5,1390,870)}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(on)step(dt);draw();requestAnimationFrame(frame)}play.onclick=()=>{on=!on;play.textContent=on?'PAUSE':'PLAY'};document.querySelector('#reset').onclick=reset;mode.onchange=reset;
rec.onclick=()=>{if(recorder?.state==='recording'){recorder.stop();return}const chunks=[],stream=c.captureStream(60),mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:12000000});recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);recorder.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:mime}));a.download=`D415-${mode.value}-planetary.webm`;a.click();rec.classList.remove('recording');rec.textContent='RECORD 20s'};recorder.start();rec.classList.add('recording');rec.textContent='STOP / SAVE';setTimeout(()=>recorder.state==='recording'&&recorder.stop(),20000)};reset();requestAnimationFrame(frame);
})();
</script></body></html>
