<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
<style>
  .box{fill:#fff;stroke:#111;stroke-width:3;rx:18;ry:18}
  .wire{stroke:#111;stroke-width:4;fill:none}
  .thin{stroke:#111;stroke-width:2;fill:none}
  .txt{font-family:Arial,sans-serif;font-size:28px;fill:#111}
  .small{font-family:Arial,sans-serif;font-size:22px;fill:#111}
  .title{font-family:Arial,sans-serif;font-size:38px;font-weight:bold;fill:#111}
  .pin{fill:#fff;stroke:#111;stroke-width:3}
</style>
<text x="70" y="60" class="title">One-Wave V0 Intrinsic Organelle Cell — Block Schematic</text>
<text x="70" y="95" class="small">No Pico, Arduino, Jetson, FPGA, software clock, or external processor in the operating loop.</text>

<!-- rails -->
<line x1="90" y1="160" x2="1510" y2="160" class="wire"/>
<text x="95" y="145" class="txt">VA (+ reference)</text>
<line x1="90" y1="890" x2="1510" y2="890" class="wire"/>
<text x="95" y="930" class="txt">VB (− reference)</text>
<line x1="90" y1="525" x2="1510" y2="525" class="thin" stroke-dasharray="12 10"/>
<text x="95" y="510" class="txt">VREL / shared relational center</text>

<!-- Mirror gate -->
<rect x="110" y="260" width="270" height="360" class="box"/>
<text x="150" y="310" class="txt">MIRROR GATE</text>
<text x="145" y="355" class="small">• dual-reference compare</text>
<text x="145" y="395" class="small">• zero / hold window</text>
<text x="145" y="435" class="small">• ternary resolve</text>
<text x="145" y="475" class="small">• crossing event</text>
<text x="145" y="535" class="small">Outputs:</text>
<text x="145" y="570" class="small">STATE = −1 / 0 / +1</text>
<text x="145" y="605" class="small">CROSS = yes / no</text>
<line x1="245" y1="160" x2="245" y2="260" class="wire"/>
<line x1="245" y1="620" x2="245" y2="890" class="wire"/>
<line x1="380" y1="440" x2="460" y2="440" class="wire"/>

<!-- oscillator -->
<rect x="460" y="280" width="260" height="320" class="box"/>
<text x="500" y="330" class="txt">POINT LOOP</text>
<text x="500" y="370" class="small">self-oscillating LC</text>
<text x="500" y="405" class="small">local phase source</text>
<text x="500" y="440" class="small">phase crossing</text>
<text x="500" y="475" class="small">envelope output</text>
<text x="500" y="540" class="small">No external clock</text>
<line x1="590" y1="160" x2="590" y2="280" class="wire"/>
<line x1="590" y1="600" x2="590" y2="890" class="wire"/>
<line x1="720" y1="440" x2="800" y2="440" class="wire"/>

<!-- phase organ -->
<rect x="800" y="250" width="250" height="380" class="box"/>
<text x="835" y="305" class="txt">PHASE ORGAN</text>
<text x="835" y="355" class="small">PASS</text>
<text x="835" y="395" class="small">HOLD</text>
<text x="835" y="435" class="small">FLIP</text>
<text x="835" y="495" class="small">local handedness</text>
<text x="835" y="530" class="small">CW / HOLD / CCW</text>
<line x1="925" y1="160" x2="925" y2="250" class="wire"/>
<line x1="925" y1="630" x2="925" y2="890" class="wire"/>
<line x1="1050" y1="440" x2="1130" y2="440" class="wire"/>

<!-- memory -->
<rect x="1130" y="230" width="330" height="420" class="box"/>
<text x="1170" y="285" class="txt">MAGNETIC MEMORY</text>
<text x="1170" y="335" class="small">maintain winding</text>
<text x="1170" y="375" class="small">rewrite / flip winding</text>
<text x="1170" y="415" class="small">sense winding</text>
<text x="1170" y="455" class="small">neighbor coupling winding</text>
<text x="1170" y="520" class="small">stores:</text>
<text x="1170" y="555" class="small">ternary orientation</text>
<text x="1170" y="590" class="small">preferred path</text>
<line x1="1295" y1="160" x2="1295" y2="230" class="wire"/>
<line x1="1295" y1="650" x2="1295" y2="890" class="wire"/>

<!-- modulation block -->
<rect x="455" y="700" width="330" height="150" class="box"/>
<text x="485" y="750" class="txt">5-STATE MODULATION</text>
<text x="485" y="795" class="small">Floor / Low / Middle / High / Ceiling</text>
<line x1="620" y1="700" x2="620" y2="600" class="wire"/>

<!-- reinjection -->
<rect x="835" y="700" width="360" height="150" class="box"/>
<text x="875" y="750" class="txt">MITOCHONDRIA / REINJECTION</text>
<text x="875" y="795" class="small">LOSS REQUEST ∧ PHASE MATCH → pulse</text>
<line x1="1015" y1="700" x2="1015" y2="630" class="wire"/>
<line x1="1195" y1="775" x2="1295" y2="775" class="wire"/>

<!-- neighbor -->
<rect x="1320" y="700" width="180" height="150" class="box"/>
<text x="1350" y="750" class="txt">NEIGHBOR</text>
<text x="1345" y="790" class="small">receive / isolate</text>
<text x="1345" y="825" class="small">align / exchange</text>

<!-- labels -->
<text x="430" y="205" class="small">state + crossing</text>
<text x="745" y="205" class="small">phase + envelope</text>
<text x="1085" y="205" class="small">handedness / route</text>

<!-- equations -->
<text x="95" y="995" class="small">Intrinsic rule: INJECT = LOSS_REQUEST ∧ PHASE_MATCH.  MAINTAIN reinforces the stored state; WRITE/FLIP changes it.</text>
</svg>