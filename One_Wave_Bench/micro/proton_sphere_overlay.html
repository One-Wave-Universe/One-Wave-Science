<div id="pso-root">
  <div class="viz-controls">
    <button id="pso-run" class="btn btn-primary" type="button" aria-pressed="true">Pause</button>
    <button id="pso-reset" class="btn" type="button">Reset view</button>
    <label class="form-check form-switch" for="pso-gray">
      <input id="pso-gray" class="form-check-input" type="checkbox">
      <span class="form-check-label">Standard Model overlay</span>
    </label>
    <label class="form-label" for="pso-cut">Cutaway <span id="pso-cut-value">45%</span>
      <input id="pso-cut" class="form-range" type="range" min="0" max="85" value="45" step="5">
    </label>
    <label class="form-label" for="pso-speed">Motion <span id="pso-speed-value">1.00×</span>
      <input id="pso-speed" class="form-range" type="range" min="0.25" max="2" value="1" step="0.05">
    </label>
  </div>
  <div class="viz-row pso-readout" aria-live="polite">
    <span><strong>Internal winding</strong> +3</span>
    <span><strong>Valence overlay</strong> <span id="pso-valence">off</span></span>
    <span><strong>Net charge</strong> <span id="pso-charge">field candidate</span></span>
    <span class="viz-badge">drag to rotate · scroll to zoom</span>
  </div>
  <div class="text-small pso-legend" id="pso-legend">Core colors = identity · links = pair coupling · shell hue = enclosing Field phase</div>
  <div class="card pso-stage">
    <canvas id="pso-canvas" width="704" height="520" aria-label="Rotatable spherical proton candidate with three connected internal vortex cores and optional Standard Model interpretation"></canvas>
  </div>
  <div id="pso-detail" class="text-small">Point = internal core rotation · Path = carried orbital trace · Field = spherical phase boundary</div>
</div>

<style>
#pso-root { color: var(--foreground); width: 100%; }
#pso-root .pso-readout { justify-content: flex-start; gap: 1rem; margin: .5rem 0; }
#pso-root .pso-legend, #pso-root #pso-detail { color: var(--muted-foreground); }
#pso-root .pso-legend { margin-bottom: .4rem; }
#pso-root #pso-detail { margin-top: .4rem; }
#pso-root .pso-stage { padding: 0; overflow: hidden; }
#pso-root canvas { display: block; width: 100%; height: auto; background: var(--background); touch-action: none; cursor: grab; }
#pso-root canvas:active { cursor: grabbing; }
</style>

<script>
(() => {
  const root = document.getElementById("pso-root");
  const canvas = document.getElementById("pso-canvas");
  const ctx = canvas.getContext("2d", { alpha: false });
  const runButton = document.getElementById("pso-run");
  const resetButton = document.getElementById("pso-reset");
  const grayInput = document.getElementById("pso-gray");
  const cutInput = document.getElementById("pso-cut");
  const speedInput = document.getElementById("pso-speed");
  const cutValue = document.getElementById("pso-cut-value");
  const speedValue = document.getElementById("pso-speed-value");
  const valenceText = document.getElementById("pso-valence");
  const chargeText = document.getElementById("pso-charge");
  const legend = document.getElementById("pso-legend");
  const detail = document.getElementById("pso-detail");

  let running = true;
  let yaw = -0.5;
  let pitch = 0.3;
  let zoom = 1;
  let simTime = 0;
  let last = performance.now();
  let dragging = false;
  let pointerX = 0;
  let pointerY = 0;
  const trails = [[], [], []];
  const identityNames = ["V1", "V2", "V3"];
  const flavors = ["u", "u", "d"];
  const colorTags = ["R", "G", "B"];

  const probe = document.createElement("canvas");
  probe.width = probe.height = 1;
  const probeCtx = probe.getContext("2d");
  function color(name) { return getComputedStyle(root).getPropertyValue(name).trim(); }
  function rgb(name) {
    probeCtx.clearRect(0, 0, 1, 1);
    probeCtx.fillStyle = color(name);
    probeCtx.fillRect(0, 0, 1, 1);
    return Array.from(probeCtx.getImageData(0, 0, 1, 1).data.slice(0, 3));
  }
  function mix(a, b, t) { return [0,1,2].map(i => Math.round(a[i] + (b[i]-a[i])*t)); }
  function rgba(value, alpha) { return "rgba(" + value[0] + "," + value[1] + "," + value[2] + "," + alpha + ")"; }

  function rotate(point) {
    const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    const x1 = cy*point.x + sy*point.z;
    const z1 = -sy*point.x + cy*point.z;
    return { x: x1, y: cp*point.y-sp*z1, z: sp*point.y+cp*z1 };
  }
  function project(point) {
    const rotated = rotate(point);
    const perspective = 2.8 / (2.8-rotated.z);
    const scale = canvas.height * 0.34 * zoom * perspective;
    return { x: canvas.width/2 + rotated.x*scale, y: canvas.height/2-rotated.y*scale, z: rotated.z, scale };
  }
  function coreStates() {
    const common = simTime * 0.62;
    return [0,1,2].map(index => {
      const angle = common + index*2*Math.PI/3;
      const wobble = 0.08*Math.sin(simTime*0.9+index*2*Math.PI/3);
      return {
        x: (0.49+wobble)*Math.cos(angle),
        y: (0.49+wobble)*Math.sin(angle),
        z: 0.13*Math.sin(2*angle+index),
        spin: simTime*2.1+index*2*Math.PI/3
      };
    });
  }

  function drawSphereGrid() {
    const foreground = color("--foreground");
    const boundary = rgb("--viz-series-4");
    const cut = Number(cutInput.value)/100;
    for (let latitude = -3; latitude <= 3; latitude += 1) {
      const phi = latitude*Math.PI/8;
      const points = [];
      for (let step = 0; step <= 96; step += 1) {
        const theta = step*2*Math.PI/96 + simTime*0.08;
        points.push({ x: Math.cos(phi)*Math.cos(theta), y: Math.sin(phi), z: Math.cos(phi)*Math.sin(theta) });
      }
      drawCurve(points, boundary, 0.22, cut);
    }
    for (let longitude = 0; longitude < 8; longitude += 1) {
      const theta = longitude*Math.PI/4 + simTime*0.08;
      const points = [];
      for (let step = 0; step <= 64; step += 1) {
        const phi = -Math.PI/2 + step*Math.PI/64;
        points.push({ x: Math.cos(phi)*Math.cos(theta), y: Math.sin(phi), z: Math.cos(phi)*Math.sin(theta) });
      }
      drawCurve(points, boundary, 0.18, cut);
    }
    const center = project({x:0,y:0,z:0});
    ctx.strokeStyle = foreground;
    ctx.globalAlpha = 0.48;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(center.x, center.y, canvas.height*0.34*zoom, 0, 2*Math.PI);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  function drawCurve(points, stroke, alpha, cut) {
    let active = false;
    ctx.strokeStyle = rgba(stroke, alpha);
    ctx.lineWidth = 1;
    ctx.beginPath();
    points.forEach(point => {
      const projected = project(point);
      const hiddenByCut = projected.z > 1-cut*1.7;
      if (hiddenByCut) { active = false; return; }
      if (!active) { ctx.moveTo(projected.x, projected.y); active = true; }
      else ctx.lineTo(projected.x, projected.y);
    });
    ctx.stroke();
  }

  function drawFieldParticles() {
    const background = rgb("--background");
    const series = [1,2,3,4,5,6].map(i => rgb("--viz-series-"+i));
    const cut = Number(cutInput.value)/100;
    for (let i = 0; i < 260; i += 1) {
      const u = (i+0.5)/260;
      const z = 1.8*u-0.9;
      const theta = i*2.399963 + simTime*(0.08+0.03*Math.sin(i));
      const radius = 0.90*Math.sqrt(Math.max(0,1-(z/0.9)*(z/0.9)));
      const point = {x:radius*Math.cos(theta),y:radius*Math.sin(theta),z};
      const projected = project(point);
      if (projected.z > 1-cut*1.7) continue;
      const phaseIndex = ((Math.floor(((theta%(2*Math.PI)+2*Math.PI)%(2*Math.PI))/(2*Math.PI)*6))%6+6)%6;
      const fill = mix(background, series[phaseIndex], 0.72);
      ctx.fillStyle = rgba(fill, 0.32+0.28*(projected.z+1)/2);
      ctx.beginPath();
      ctx.arc(projected.x, projected.y, Math.max(0.8,1.6*zoom*(1+projected.z*0.25)), 0, 2*Math.PI);
      ctx.fill();
    }
  }

  function drawConnections(states, projected) {
    const foreground = color("--foreground");
    for (let i = 0; i < states.length; i += 1) for (let j = i+1; j < states.length; j += 1) {
      ctx.strokeStyle = foreground;
      ctx.globalAlpha = 0.5;
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(projected[i].x, projected[i].y);
      const midpointX = (projected[i].x+projected[j].x)/2;
      const midpointY = (projected[i].y+projected[j].y)/2-10*zoom;
      ctx.quadraticCurveTo(midpointX, midpointY, projected[j].x, projected[j].y);
      ctx.stroke();
      if (grayInput.checked) {
        ctx.globalAlpha = 0.82;
        ctx.fillStyle = foreground;
        ctx.font = "500 12px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("g", midpointX, midpointY-3);
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawTrails(states) {
    const colors = [1,2,3].map(i => color("--viz-series-"+i));
    states.forEach((state,index) => {
      trails[index].push({...state});
      if (trails[index].length>150) trails[index].shift();
      ctx.strokeStyle = colors[index];
      ctx.globalAlpha = 0.48;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      trails[index].forEach((point,pointIndex) => {
        const p=project(point);
        if (pointIndex===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
      });
      ctx.stroke();
    });
    ctx.globalAlpha=1;
  }

  function drawCores(states, projected) {
    const colors = [1,2,3].map(i => color("--viz-series-"+i));
    const foreground = color("--foreground");
    const permutation = Math.floor(simTime/3)%3;
    projected.map((point,index)=>({point,index})).sort((a,b)=>a.point.z-b.point.z).forEach(item => {
      const index=item.index, point=item.point, state=states[index];
      const radius=Math.max(7,12*zoom*(1+point.z*0.18));
      ctx.fillStyle=colors[index];
      ctx.globalAlpha=0.92;
      ctx.beginPath();ctx.arc(point.x,point.y,radius,0,2*Math.PI);ctx.fill();
      ctx.strokeStyle=foreground;ctx.lineWidth=1.2;ctx.stroke();
      ctx.globalAlpha=0.72;
      ctx.beginPath();
      ctx.arc(point.x,point.y,radius+5, state.spin, state.spin+Math.PI*1.45);
      ctx.strokeStyle=colors[index];ctx.lineWidth=2;ctx.stroke();
      ctx.globalAlpha=1;
      const label=grayInput.checked ? flavors[index]+"_"+colorTags[(index+permutation)%3] : identityNames[index];
      ctx.fillStyle=foreground;ctx.font="500 13px system-ui";ctx.textAlign="center";
      ctx.fillText(label,point.x,point.y-radius-9);
    });
  }

  function render() {
    const background=rgb("--background");
    ctx.fillStyle=rgba(background,1);ctx.fillRect(0,0,canvas.width,canvas.height);
    drawFieldParticles();
    drawSphereGrid();
    const states=coreStates();
    const projected=states.map(project);
    drawTrails(states);
    drawConnections(states,projected);
    drawCores(states,projected);
  }

  function updateOverlayText() {
    if (grayInput.checked) {
      valenceText.textContent="uud";
      chargeText.textContent="+1e";
      legend.textContent="Shell hue = One-Wave phase · u/u/d and R/G/B = Standard Model interpretation · g links = gluon-exchange interpretation";
      detail.textContent="Overlay is interpretive: QCD color labels are not literal display colors and their instantaneous assignment rotates";
    } else {
      valenceText.textContent="off";
      chargeText.textContent="field candidate";
      legend.textContent="Core colors = identity · links = pair coupling · shell hue = enclosing Field phase";
      detail.textContent="Point = internal core rotation · Path = carried orbital trace · Field = spherical phase boundary";
    }
  }
  function frame(now) {
    const dt=Math.min(0.04,(now-last)/1000);last=now;
    if (running) simTime+=dt*Number(speedInput.value);
    render();
    requestAnimationFrame(frame);
  }
  runButton.addEventListener("click",()=>{running=!running;runButton.textContent=running?"Pause":"Run";runButton.setAttribute("aria-pressed",String(running));last=performance.now();});
  resetButton.addEventListener("click",()=>{yaw=-0.5;pitch=0.3;zoom=1;trails.forEach(trail=>trail.splice(0));});
  grayInput.addEventListener("change",updateOverlayText);
  cutInput.addEventListener("input",()=>{cutValue.textContent=cutInput.value+"%";});
  speedInput.addEventListener("input",()=>{speedValue.textContent=Number(speedInput.value).toFixed(2)+"×";});
  canvas.addEventListener("pointerdown",event=>{dragging=true;pointerX=event.clientX;pointerY=event.clientY;canvas.setPointerCapture(event.pointerId);});
  canvas.addEventListener("pointermove",event=>{if(!dragging)return;yaw+=(event.clientX-pointerX)*0.008;pitch=Math.max(-1.35,Math.min(1.35,pitch+(event.clientY-pointerY)*0.008));pointerX=event.clientX;pointerY=event.clientY;});
  canvas.addEventListener("pointerup",event=>{dragging=false;canvas.releasePointerCapture(event.pointerId);});
  canvas.addEventListener("wheel",event=>{event.preventDefault();zoom=Math.max(0.7,Math.min(1.45,zoom*Math.exp(-event.deltaY*0.001)));},{passive:false});
  updateOverlayText();
  requestAnimationFrame(frame);
})();
</script>
