<!doctype html><meta charset="utf-8"><title>Composite Agent Lab</title>
<style>body{font:15px system-ui;max-width:1000px;margin:32px auto;padding:0 18px}textarea,input,select{width:100%;box-sizing:border-box;margin:4px 0 12px;padding:8px}button{padding:9px 14px}pre{background:#111;color:#eee;padding:14px;overflow:auto;border-radius:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{border:1px solid #aaa;padding:14px;border-radius:10px}</style>
<h1>Composite Agent Lab</h1><p>Void = admin/inner voice. Field = senses/speech/action. One shared software-cell state.</p>
<div class="grid"><div class="card"><h3>Providers</h3><label>Field</label><select id="field"></select><label>Void</label><select id="void"></select><label>Parser</label><select id="parser"></select><label><input id="sandbox" type="checkbox" checked> sandbox mode</label><button id="save">Save</button></div>
<div class="card"><h3>Run one cycle</h3><label>Goal</label><input id="goal"><label>Reference</label><input id="reference"><label>Input</label><textarea id="input"></textarea><button id="run">Run cycle</button></div></div>
<h3>Result</h3><pre id="out">Ready.</pre><script src="ui.js"></script>
