<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P0 Ternary Virtual Breadboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0e27;
      color: #e9f0ff;
      overflow: hidden;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 300px;
      grid-template-rows: 60px 1fr 200px;
      height: 100vh;
      gap: 8px;
      padding: 8px;
    }

    header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1a1f3a;
      border: 1px solid #2a3a5a;
      border-radius: 6px;
      padding: 0 16px;
      font-size: 18px;
      font-weight: 600;
    }

    .status {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #22dd22;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    #viewport {
      grid-column: 1;
      grid-row: 2;
      background: #000;
      border: 1px solid #2a3a5a;
      border-radius: 6px;
      position: relative;
    }

    .sidebar {
      grid-column: 2;
      grid-row: 2;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }

    .panel {
      background: #1a1f3a;
      border: 1px solid #2a3a5a;
      border-radius: 6px;
      padding: 12px;
      font-size: 12px;
    }

    .panel-title {
      font-weight: 600;
      margin-bottom: 8px;
      color: #aab8ff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .meter {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      border-bottom: 1px solid #2a3a5a;
    }

    .meter:last-child {
      border-bottom: none;
    }

    .meter-label {
      font-size: 11px;
      color: #7a88bb;
    }

    .meter-value {
      font-family: 'Courier New', monospace;
      font-weight: 600;
      text-align: right;
      color: #22dd22;
    }

    .meter-value.warning {
      color: #ffdd22;
    }

    .meter-value.error {
      color: #ff2222;
    }

    .control-group {
      margin-bottom: 8px;
    }

    .control-label {
      font-size: 11px;
      color: #7a88bb;
      margin-bottom: 4px;
      display: block;
    }

    input[type="range"] {
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: #2a3a5a;
      outline: none;
      -webkit-appearance: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #22dd22;
      cursor: pointer;
    }

    button {
      background: #2a3a5a;
      color: #e9f0ff;
      border: 1px solid #3a4a7a;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }

    button:hover {
      background: #3a4a7a;
      border-color: #4a5aaa;
    }

    button.active {
      background: #22dd22;
      color: #000;
      border-color: #22dd22;
    }

    .waveform-container {
      grid-column: 1 / -1;
      grid-row: 3;
      background: #1a1f3a;
      border: 1px solid #2a3a5a;
      border-radius: 6px;
      padding: 8px;
      position: relative;
    }

    #waveformChart {
      height: 100%;
      width: 100%;
    }

    .info-box {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #000c;
      border: 1px solid #2a3a5a;
      border-radius: 4px;
      padding: 8px;
      font-size: 11px;
      font-family: 'Courier New', monospace;
      color: #7a88bb;
      z-index: 10;
      max-width: 300px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span>⚡ P0 Ternary Virtual Breadboard</span>
      <div class="status">
        <span>Simulation: <strong id="simTime">0.0µs</strong></span>
        <div class="status-indicator"></div>
      </div>
    </header>

    <div id="viewport">
      <div class="info-box" id="infoBox"></div>
    </div>

    <div class="sidebar">
      <!-- Node Voltages -->
      <div class="panel">
        <div class="panel-title">Node Voltages</div>
        <div class="meter">
          <span class="meter-label">V(+V)</span>
          <span class="meter-value" id="v_supply">5.000V</span>
        </div>
        <div class="meter">
          <span class="meter-label">V(0) Virtual GND</span>
          <span class="meter-value" id="v_vg">2.500V</span>
        </div>
        <div class="meter">
          <span class="meter-label">V(mid_U)</span>
          <span class="meter-value" id="v_mid_u">0.000V</span>
        </div>
        <div class="meter">
          <span class="meter-label">V(mid_V)</span>
          <span class="meter-value" id="v_mid_v">0.000V</span>
        </div>
        <div class="meter">
          <span class="meter-label">V(mid_W)</span>
          <span class="meter-value" id="v_mid_w">0.000V</span>
        </div>
      </div>

      <!-- Currents -->
      <div class="panel">
        <div class="panel-title">Phase Currents</div>
        <div class="meter">
          <span class="meter-label">I(L_U)</span>
          <span class="meter-value" id="i_lu">0.000mA</span>
        </div>
        <div class="meter">
          <span class="meter-label">I(L_V)</span>
          <span class="meter-value" id="i_lv">0.000mA</span>
        </div>
        <div class="meter">
          <span class="meter-label">I(L_W)</span>
          <span class="meter-value" id="i_lw">0.000mA</span>
        </div>
      </div>

      <!-- Gate Control -->
      <div class="panel">
        <div class="panel-title">Gate Control</div>
        <div class="control-group">
          <label class="control-label">U_HS Gate</label>
          <input type="range" id="gate_u_hs" min="0" max="5.5" step="0.1" value="0">
          <span class="meter-value" id="gate_u_hs_val">0.0V</span>
        </div>
        <div class="control-group">
          <label class="control-label">V_HS Gate</label>
          <input type="range" id="gate_v_hs" min="0" max="5.5" step="0.1" value="0">
          <span class="meter-value" id="gate_v_hs_val">0.0V</span>
        </div>
        <div class="control-group">
          <label class="control-label">W_HS Gate</label>
          <input type="range" id="gate_w_hs" min="0" max="5.5" step="0.1" value="0">
          <span class="meter-value" id="gate_w_hs_val">0.0V</span>
        </div>
      </div>

      <!-- Test Control -->
      <div class="panel">
        <div class="panel-title">Test Modes</div>
        <button id="btnDCTest" class="active">DC Steady</button>
        <button id="btnDynamicTest">Dynamic</button>
        <button id="btnSequenceTest">Sequence</button>
        <button id="btnStopTest">Stop</button>
      </div>
    </div>

    <div class="waveform-container">
      <canvas id="waveformChart"></canvas>
    </div>
  </div>

  <script>
    // ===== Three.js 3D Circuit Visualization =====
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const viewport = document.getElementById('viewport');
    const camera = new THREE.PerspectiveCamera(75, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
    camera.position.set(3, 3, 3);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    viewport.appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(5, 5, 5);
    scene.add(directionalLight);

    // Circuit components (simplified 3D representation)
    const components = {};

    // Power rails (boxes)
    const railGeom = new THREE.BoxGeometry(0.1, 0.1, 4);
    const railMatPos = new THREE.MeshStandardMaterial({ color: 0xff4444 });
    const railMatNeg = new THREE.MeshStandardMaterial({ color: 0x4444ff });

    const railPos = new THREE.Mesh(railGeom, railMatPos);
    railPos.position.set(0, 1.5, 0);
    scene.add(railPos);
    components['+V'] = railPos;

    const railNeg = new THREE.Mesh(railGeom, railMatNeg);
    railNeg.position.set(0, -1.5, 0);
    scene.add(railNeg);
    components['GND'] = railNeg;

    // Virtual ground (green line)
    const vgGeom = new THREE.BoxGeometry(0.05, 0.05, 4);
    const vgMat = new THREE.MeshStandardMaterial({ color: 0x22dd22 });
    const vg = new THREE.Mesh(vgGeom, vgMat);
    vg.position.set(1.5, 0, 0);
    scene.add(vg);
    components['0'] = vg;

    // Phase windings (cylinders)
    const windingGeom = new THREE.CylinderGeometry(0.2, 0.2, 1, 16);
    const windingMat = new THREE.MeshStandardMaterial({ color: 0xffaa44 });

    const phases = ['U', 'V', 'W'];
    for (let i = 0; i < phases.length; i++) {
      const winding = new THREE.Mesh(windingGeom, windingMat);
      winding.position.set(-1.5, 0, (i - 1) * 1.5);
      scene.add(winding);
      components[`L_${phases[i]}`] = winding;
    }

    // Simulation data
    let simData = {
      time: 0,
      history: [],
      voltages: {}
    };

    // Waveform chart
    const chartCanvas = document.getElementById('waveformChart');
    let chart = new Chart(chartCanvas, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          {
            label: 'V(0) Virtual Ground',
            data: [],
            borderColor: '#22dd22',
            backgroundColor: 'rgba(34, 221, 34, 0.1)',
            tension: 0.1,
            borderWidth: 2,
            fill: false
          },
          {
            label: 'I(L_U)',
            data: [],
            borderColor: '#ff8844',
            backgroundColor: 'rgba(255, 136, 68, 0.1)',
            tension: 0.1,
            borderWidth: 2,
            fill: false,
            yAxisID: 'y1'
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: true, labels: { color: '#aab8ff' } }
        },
        scales: {
          y: {
            type: 'linear',
            display: true,
            position: 'left',
            ticks: { color: '#7a88bb' },
            grid: { color: '#2a3a5a' }
          },
          y1: {
            type: 'linear',
            display: true,
            position: 'right',
            ticks: { color: '#7a88bb' },
            grid: { drawOnChartArea: false }
          },
          x: {
            ticks: { color: '#7a88bb' },
            grid: { color: '#2a3a5a' }
          }
        }
      }
    });

    // UI Update Functions
    function updateMeters(state) {
      document.getElementById('simTime').textContent = (state.time_us || 0).toFixed(1) + 'µs';

      // Voltages
      const v_supply = state.voltages?.['+V'] || 5.0;
      const v_vg = state.voltages?.['0'] || 2.5;
      const v_u = state.voltages?.['mid_U'] || 0;
      const v_v = state.voltages?.['mid_V'] || 0;
      const v_w = state.voltages?.['mid_W'] || 0;

      document.getElementById('v_supply').textContent = v_supply.toFixed(3) + 'V';
      document.getElementById('v_vg').textContent = v_vg.toFixed(3) + 'V';
      document.getElementById('v_mid_u').textContent = v_u.toFixed(3) + 'V';
      document.getElementById('v_mid_v').textContent = v_v.toFixed(3) + 'V';
      document.getElementById('v_mid_w').textContent = v_w.toFixed(3) + 'V';

      // Color code virtual ground
      let vgStatus = document.getElementById('v_vg');
      if (Math.abs(v_vg - 2.5) < 0.05) {
        vgStatus.className = 'meter-value';
      } else if (Math.abs(v_vg - 2.5) < 0.1) {
        vgStatus.className = 'meter-value warning';
      } else {
        vgStatus.className = 'meter-value error';
      }

      // Currents
      const i_u = (state.inductor_currents?.L_U || 0) * 1000;
      const i_v = (state.inductor_currents?.L_V || 0) * 1000;
      const i_w = (state.inductor_currents?.L_W || 0) * 1000;

      document.getElementById('i_lu').textContent = i_u.toFixed(3) + 'mA';
      document.getElementById('i_lv').textContent = i_v.toFixed(3) + 'mA';
      document.getElementById('i_lw').textContent = i_w.toFixed(3) + 'mA';
    }

    // Gate control listeners
    ['u_hs', 'v_hs', 'w_hs'].forEach(gate => {
      document.getElementById(`gate_${gate}`).addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        document.getElementById(`gate_${gate}_val`).textContent = val.toFixed(1) + 'V';
      });
    });

    // Test mode buttons
    document.getElementById('btnDCTest').addEventListener('click', () => {
      document.querySelectorAll('.panel:last-child button').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      console.log('DC Steady-State test mode');
    });

    document.getElementById('btnDynamicTest').addEventListener('click', () => {
      document.querySelectorAll('.panel:last-child button').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      console.log('Dynamic test mode');
    });

    document.getElementById('btnSequenceTest').addEventListener('click', () => {
      document.querySelectorAll('.panel:last-child button').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      console.log('Gate sequence test mode');
    });

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);

      // Rotate components slightly for visual feedback
      Object.values(components).forEach((comp, i) => {
        if (comp.geometry.type === 'CylinderGeometry') {
          comp.rotation.z += 0.002;
        }
      });

      renderer.render(scene, camera);
    }

    animate();

    // Handle window resize
    window.addEventListener('resize', () => {
      const w = viewport.clientWidth;
      const h = viewport.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    // Simulated data for demo
    setInterval(() => {
      simData.time += 1;
      const t = simData.time / 1000;

      const state = {
        time_us: simData.time,
        voltages: {
          '+V': 5.0,
          '0': 2.5 + 0.05 * Math.sin(t),
          'mid_U': 2.5 + 1.2 * Math.sin(t),
          'mid_V': 2.5 + 1.2 * Math.sin(t + 2.09),
          'mid_W': 2.5 + 1.2 * Math.sin(t + 4.19)
        },
        inductor_currents: {
          'L_U': 0.005 * Math.sin(t),
          'L_V': 0.005 * Math.sin(t + 2.09),
          'L_W': 0.005 * Math.sin(t + 4.19)
        }
      };

      updateMeters(state);

      // Update chart
      if (chart.data.labels.length > 500) {
        chart.data.labels.shift();
        chart.data.datasets.forEach(ds => ds.data.shift());
      }

      chart.data.labels.push((simData.time / 1000).toFixed(3));
      chart.data.datasets[0].data.push(state.voltages['0']);
      chart.data.datasets[1].data.push(state.inductor_currents['L_U'] * 1000);
      chart.update('none');
    }, 100);
  </script>
</body>
</html>
