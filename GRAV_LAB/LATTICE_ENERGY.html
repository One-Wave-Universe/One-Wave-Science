<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>One Wave — lattice, vortices, knot</title>
<style>
  html, body { margin: 0; height: 100%; background: #140e0a; color: #f3e2c4; font: 15px/1.4 Georgia, serif; }
  main { display: grid; grid-template-columns: 1fr 280px; height: 100%; }
  canvas { width: 100%; height: 100%; display: block; background: #100c09; }
  aside { padding: 16px; border-left: 1px solid #5a4636; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  button { margin: 8px 6px 0 0; background: #e39b4a; color: #1a120c; border: 0; padding: 8px 12px; font: inherit; }
  button.on { outline: 2px solid #f3e2c4; }
  label { display: block; margin: 12px 0 4px; }
  input { width: 100%; }
  .num { font-variant-numeric: tabular-nums; color: #ffb15e; }
</style>
</head>
<body>
<main>
  <canvas id="c"></canvas>
  <aside>
    <h1>Separate and combined</h1>
    <p>Lattice energy, three vortex phases, one knot. Same field.</p>
    <button id="m-lat" type="button" class="on">Lattice</button>
    <button id="m-vor" type="button">Vortices</button>
    <button id="m-knot" type="button">Knot</button>
    <button id="m-all" type="button">Combined</button>
    <label>Parent amplitude <span id="ampv" class="num">1.0</span></label>
    <input id="amp" type="range" min="0" max="2" step="0.05" value="1"/>
    <label>Organization scale <span id="sigv" class="num">1.6</span></label>
    <input id="sig" type="range" min="0.4" max="4" step="0.1" value="1.6"/>
    <button id="drop" type="button">Drop parent</button>
    <p>Mode <span id="mode" class="num">lattice</span></p>
    <p>Field energy <span id="en" class="num">0</span></p>
  </aside>
</main>
<script src="modules/wake.js"></script>
<script src="modules/lattice.js"></script>
<script src="modules/energy.js"></script>
<script src="modules/motion.js"></script>
<script src="modules/view.js"></script>
<script src="modules/vortices.js"></script>
<script src="modules/knot.js"></script>
<script src="modules/knot_view.js"></script>
<script>
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let parentOn = 1;
let mode = "lattice";
document.getElementById("drop").onclick = () => {
  parentOn = parentOn ? 0 : 1;
  document.getElementById("drop").textContent = parentOn ? "Drop parent" : "Restore parent";
};
for (const [id, name] of [["m-lat","lattice"],["m-vor","vortices"],["m-knot","knot"],["m-all","combined"]]) {
  document.getElementById(id).onclick = () => {
    mode = name;
    for (const b of document.querySelectorAll("aside button")) b.classList.remove("on");
    document.getElementById(id).classList.add("on");
  };
}
const field = { parent: { amp: 1, sigma: 1.6 }, sites: OW.lattice(5), kids: OW.kids(), vortices: OW.vortices(), energy: 0 };
function resize() { cv.width = cv.clientWidth * devicePixelRatio; cv.height = cv.clientHeight * devicePixelRatio; }
window.addEventListener("resize", resize); resize();
function frame() {
  field.parent.amp = parentOn * parseFloat(document.getElementById("amp").value);
  field.parent.sigma = parseFloat(document.getElementById("sig").value);
  document.getElementById("ampv").textContent = field.parent.amp.toFixed(2);
  document.getElementById("sigv").textContent = field.parent.sigma.toFixed(2);
  document.getElementById("mode").textContent = mode;
  OW.energy(field);
  OW.motion(field);
  OW.stepVortices(field.vortices);
  const pts = OW.knot(field.vortices);
  const w = cv.width, h = cv.height, dpr = devicePixelRatio;
  const cx = w * 0.5, cy = h * 0.5, scale = Math.min(w, h) * 0.12;
  ctx.fillStyle = "#100c09";
  ctx.fillRect(0, 0, w, h);
  if (mode === "lattice" || mode === "combined") OW.view(ctx, field, w, h, dpr);
  if (mode === "vortices" || mode === "combined") OW.drawVortices(ctx, field.vortices, cx, cy, scale, dpr);
  if (mode === "knot" || mode === "combined") OW.drawKnot(ctx, pts, cx, cy, scale, dpr);
  document.getElementById("en").textContent = field.energy.toFixed(2);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
