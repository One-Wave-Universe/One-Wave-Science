<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>One Wave — lattice energy</title>
<style>
  html, body { margin: 0; height: 100%; background: #140e0a; color: #f3e2c4; font: 15px/1.4 Georgia, serif; }
  main { display: grid; grid-template-columns: 1fr 280px; height: 100%; }
  canvas { width: 100%; height: 100%; display: block; background: #100c09; }
  aside { padding: 16px; border-left: 1px solid #5a4636; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  label { display: block; margin: 12px 0 4px; }
  input { width: 100%; }
  button { margin-top: 12px; background: #e39b4a; color: #1a120c; border: 0; padding: 8px 12px; font: inherit; }
  .num { font-variant-numeric: tabular-nums; color: #ffb15e; }
</style>
</head>
<body>
<main>
  <canvas id="c"></canvas>
  <aside>
    <h1>Lattice energy</h1>
    <p>Modules: wake, lattice, energy, motion, view. One field.</p>
    <label>Parent amplitude <span id="ampv" class="num">1.0</span></label>
    <input id="amp" type="range" min="0" max="2" step="0.05" value="1"/>
    <label>Organization scale <span id="sigv" class="num">1.6</span></label>
    <input id="sig" type="range" min="0.4" max="4" step="0.1" value="1.6"/>
    <button id="drop" type="button">Drop parent</button>
    <p>chi at center <span id="chi" class="num">0</span></p>
    <p>Field energy <span id="en" class="num">0</span></p>
    <p>Child radius <span id="rad" class="num">0</span></p>
  </aside>
</main>
<script src="modules/wake.js"></script>
<script src="modules/lattice.js"></script>
<script src="modules/energy.js"></script>
<script src="modules/motion.js"></script>
<script src="modules/view.js"></script>
<script>
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let parentOn = 1;
document.getElementById("drop").onclick = () => {
  parentOn = parentOn ? 0 : 1;
  document.getElementById("drop").textContent = parentOn ? "Drop parent" : "Restore parent";
};
const field = {
  parent: { amp: 1, sigma: 1.6 },
  sites: OW.lattice(5),
  kids: OW.kids(),
  energy: 0
};
function resize() {
  cv.width = cv.clientWidth * devicePixelRatio;
  cv.height = cv.clientHeight * devicePixelRatio;
}
window.addEventListener("resize", resize);
resize();
function frame() {
  field.parent.amp = parentOn * parseFloat(document.getElementById("amp").value);
  field.parent.sigma = parseFloat(document.getElementById("sig").value);
  document.getElementById("ampv").textContent = field.parent.amp.toFixed(2);
  document.getElementById("sigv").textContent = field.parent.sigma.toFixed(2);
  OW.energy(field);
  OW.motion(field);
  OW.view(ctx, field, cv.width, cv.height, devicePixelRatio);
  document.getElementById("chi").textContent = (field.parent.amp * OW.wake(0, field.parent.sigma)).toFixed(3);
  document.getElementById("en").textContent = field.energy.toFixed(2);
  document.getElementById("rad").textContent = Math.hypot(field.kids[0].x, field.kids[0].y).toFixed(2);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
