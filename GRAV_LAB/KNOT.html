<script>const cv=document.getElementById("c"),ctx=cv.getContext("2d");const vortices=OW.vortices();function resize(){cv.width=cv.clientWidth*devicePixelRatio;cv.height=cv.clientHeight*devicePixelRatio}addEventListener("resize",resize);resize();function frame(){OW.stepVortices(vortices);const pts=OW.knot(vortices);const w=cv.width,h=cv.height,scale=Math.min(w,h)*0.18;ctx.fillStyle="#100c09";ctx.fillRect(0,0,w,h);OW.drawKnot(ctx,pts,w/2,h/2,scale,devicePixelRatio);requestAnimationFrame(frame)}frame();</script></body></html>
