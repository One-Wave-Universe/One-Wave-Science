<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><title>Combined</title>
<style>html,body{margin:0;height:100%;background:#140e0a;color:#f3e2c4;font:15px/1.4 Georgia,serif}main{display:grid;grid-template-columns:1fr 280px;height:100%}canvas{width:100%;height:100%;background:#100c09}aside{padding:16px;border-left:1px solid #5a4636}a{color:#ffb15e}button{margin-top:12px;background:#e39b4a;color:#1a120c;border:0;padding:8px 12px;font:inherit}.num{color:#ffb15e;font-variant-numeric:tabular-nums}</style></head>
<body><main><canvas id="c"></canvas><aside><h1>Combined</h1><p>Displacement is what energy and matter do on the lattice.</p><p><a href="LATTICE.html">Lattice</a> · <a href="VORTICES.html">Vortices</a> · <a href="KNOT.html">Knot</a></p><button id="cut" type="button">Remove knot</button><p>Energy <span id="en" class="num">0</span></p><p>Matter <span id="mat" class="num">0</span></p><p>Potential <span id="v" class="num">0</span></p><p>Slope <span id="s" class="num">0</span></p><p>Point <span id="pt" class="num">0</span></p><p>Path <span id="pa" class="num">0</span></p><p>Field <span id="f" class="num">0</span></p></aside></main>
<script src="modules/wake.js"></script><script src="modules/lattice.js"></script><script src="modules/energy.js"></script><script src="modules/motion.js"></script><script src="modules/view.js"></script><script src="modules/vortices.js"></script><script src="modules/knot.js"></script><script src="modules/knot_view.js"></script><script src="modules/matter.js"></script><script src="modules/displacement.js"></script>
<script>const cv=document.getElementById("c"),ctx=cv.getContext("2d");let knotOn=1;document.getElementById("cut").onclick=()=>{knotOn=knotOn?0:1;document.getElementById("cut").textContent=knotOn?"Remove knot":"Restore knot"};const field={parent:{amp:1,sigma:1.6},sites:OW.lattice(5),kids:OW.kids(),vortices:OW.vortices(),energy:0,matter:0};function resize(){cv.width=cv.clientWidth*devicePixelRatio;cv.height=cv.clientHeight*devicePixelRatio}addEventListener("resize",resize);resize();function frame(){OW.energy(field);OW.motion(field);OW.stepVortices(field.vortices);OW.matter(field,knotOn);const d=OW.displacement(field);const w=cv.width,h=cv.height,dpr=devicePixelRatio,scale=Math.min(w,h)*0.12;OW.view(ctx,field,w,h,dpr);if(knotOn){OW.drawVortices(ctx,field.vortices,w/2,h/2,scale,dpr);OW.drawKnot(ctx,OW.knot(field.vortices),w/2,h/2,scale,dpr)}en.textContent=field.energy.toFixed(2);mat.textContent=field.matter.toFixed(3);v.textContent=d.V.toFixed(3);s.textContent=d.slope.toFixed(3);pt.textContent=d.point.toFixed(3);pa.textContent=d.path.toFixed(3);f.textContent=d.field.toFixed(3);requestAnimationFrame(frame)}frame();</script></body></html>
