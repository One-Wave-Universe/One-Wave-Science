<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><title>Combined</title>
<style>html,body{margin:0;height:100%;background:#140e0a;color:#f3e2c4;font:15px/1.4 Georgia,serif}main{display:grid;grid-template-columns:1fr 260px;height:100%}canvas{width:100%;height:100%;background:#100c09}aside{padding:16px;border-left:1px solid #5a4636}a{color:#ffb15e}</style></head>
<body><main><canvas id="c"></canvas><aside><h1>Combined</h1><p>Loads the three sims. Does not own their rules.</p><p><a href="LATTICE.html">Lattice</a> · <a href="VORTICES.html">Vortices</a> · <a href="KNOT.html">Knot</a></p></aside></main>
<script src="modules/wake.js"></script><script src="modules/lattice.js"></script><script src="modules/energy.js"></script><script src="modules/motion.js"></script><script src="modules/view.js"></script><script src="modules/vortices.js"></script><script src="modules/knot.js"></script><script src="modules/knot_view.js"></script>
<script>const cv=document.getElementById("c"),ctx=cv.getContext("2d");const field={parent:{amp:1,sigma:1.6},sites:OW.lattice(5),kids:OW.kids(),vortices:OW.vortices(),energy:0};function resize(){cv.width=cv.clientWidth*devicePixelRatio;cv.height=cv.clientHeight*devicePixelRatio}addEventListener("resize",resize);resize();function frame(){OW.energy(field);OW.motion(field);OW.stepVortices(field.vortices);const w=cv.width,h=cv.height,dpr=devicePixelRatio,scale=Math.min(w,h)*0.12;OW.view(ctx,field,w,h,dpr);OW.drawVortices(ctx,field.vortices,w/2,h/2,scale,dpr);OW.drawKnot(ctx,OW.knot(field.vortices),w/2,h/2,scale,dpr);requestAnimationFrame(frame)}frame();</script></body></html>
