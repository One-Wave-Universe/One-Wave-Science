<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><title>Displacement</title>
<style>html,body{margin:0;height:100%;background:#140e0a;color:#f3e2c4;font:15px/1.4 Georgia,serif}main{display:grid;grid-template-columns:1fr 280px;height:100%}canvas{width:100%;height:100%;background:#100c09}aside{padding:16px;border-left:1px solid #5a4636}a{color:#ffb15e}.num{color:#ffb15e;font-variant-numeric:tabular-nums}</style></head>
<body><main><canvas id="c"></canvas><aside><h1>Displacement</h1><p>V = chi. Slope = grad chi. g = -alpha slope. All three rates, from ROTATIONS3.</p><p><a href="LATTICE.html">Lattice</a> · <a href="VORTICES.html">Vortices</a> · <a href="KNOT.html">Knot</a> · <a href="COMBINED.html">Combined</a></p><p>Potential <span id="v" class="num">0</span></p><p>Slope <span id="s" class="num">0</span></p><p>Point rotation <span id="pt" class="num">0</span></p><p>Path rotation <span id="pa" class="num">0</span></p><p>Field rotation <span id="f" class="num">0</span></p></aside></main>
<script src="modules/wake.js"></script><script src="modules/lattice.js"></script><script src="modules/energy.js"></script><script src="modules/motion.js"></script><script src="modules/view.js"></script><script src="modules/displacement.js"></script>
<script>const cv=document.getElementById("c"),ctx=cv.getContext("2d");const field={parent:{amp:1,sigma:1.6,rate:0.07},sites:OW.lattice(5),kids:OW.kids(),energy:0};function resize(){cv.width=cv.clientWidth*devicePixelRatio;cv.height=cv.clientHeight*devicePixelRatio}addEventListener("resize",resize);resize();function frame(){OW.energy(field);OW.motion(field);const d=OW.displacement(field);OW.view(ctx,field,cv.width,cv.height,devicePixelRatio);v.textContent=d.V.toFixed(3);s.textContent=d.slope.toFixed(3);pt.textContent=d.point.toFixed(3);pa.textContent=d.path.toFixed(3);f.textContent=d.field.toFixed(3);requestAnimationFrame(frame)}frame();</script></body></html>
