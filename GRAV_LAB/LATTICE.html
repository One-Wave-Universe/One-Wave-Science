<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><title>Lattice energy</title>
<style>html,body{margin:0;height:100%;background:#140e0a;color:#f3e2c4;font:15px/1.4 Georgia,serif}main{display:grid;grid-template-columns:1fr 260px;height:100%}canvas{width:100%;height:100%;background:#100c09}aside{padding:16px;border-left:1px solid #5a4636}a{color:#ffb15e}button{margin-top:12px;background:#e39b4a;color:#1a120c;border:0;padding:8px 12px;font:inherit}input{width:100%}</style></head>
<body><main><canvas id="c"></canvas><aside><h1>Lattice</h1><p>This sim is only the hex field and the parent wake.</p><p><a href="VORTICES.html">Vortices</a> · <a href="KNOT.html">Knot</a> · <a href="COMBINED.html">Combined</a></p><label>Amplitude <span id="ampv">1.0</span></label><input id="amp" type="range" min="0" max="2" step="0.05" value="1"/><label>Scale <span id="sigv">1.6</span></label><input id="sig" type="range" min="0.4" max="4" step="0.1" value="1.6"/><button id="drop" type="button">Drop parent</button><p>Energy <span id="en">0</span></p></aside></main>
<script src="modules/wake.js"></script><script src="modules/lattice.js"></script><script src="modules/energy.js"></script><script src="modules/motion.js"></script><script src="modules/view.js"></script>
<script>const cv=document.getElementById("c"),ctx=cv.getContext("2d");let on=1;document.getElementById("drop").onclick=()=>{on=on?0:1};const field={parent:{amp:1,sigma:1.6},sites:OW.lattice(5),kids:OW.kids(),energy:0};function resize(){cv.width=cv.clientWidth*devicePixelRatio;cv.height=cv.clientHeight*devicePixelRatio}addEventListener("resize",resize);resize();function frame(){field.parent.amp=on*parseFloat(amp.value);field.parent.sigma=parseFloat(sig.value);ampv.textContent=field.parent.amp.toFixed(2);sigv.textContent=field.parent.sigma.toFixed(2);OW.energy(field);OW.motion(field);OW.view(ctx,field,cv.width,cv.height,devicePixelRatio);en.textContent=field.energy.toFixed(2);requestAnimationFrame(frame)}frame();</script></body></html>
