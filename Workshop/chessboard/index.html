<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sentient Surrender</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#111}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
#board{width:min(92vmin,760px);height:min(92vmin,760px);display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border:6px solid #777;box-shadow:0 14px 40px #000a}
.sq{display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.light{background:#d7d7d7}
.dark{background:#565656}
.piece{width:68%;aspect-ratio:1;border-radius:50%;border:3px solid #777;box-shadow:inset 0 0 0 6px #0002,0 3px 7px #0008}
.field{background:#ececec}
.void{background:#242424}
</style>
</head>
<body>
<div id="board" aria-label="grayscale checkers board"></div>
<script>
const board=document.getElementById('board');
for(let r=0;r<8;r++){
  for(let c=0;c<8;c++){
    const sq=document.createElement('div');
    const dark=(r+c)%2===1;
    sq.className='sq '+(dark?'dark':'light');
    if(dark && r<3){const p=document.createElement('div');p.className='piece void';sq.appendChild(p)}
    if(dark && r>4){const p=document.createElement('div');p.className='piece field';sq.appendChild(p)}
    board.appendChild(sq);
  }
}
</script>
</body>
</html>
