  <text x="54" y="112" class="noteTxt">Unboxed labels = this side faces outward, toward a cell not drawn on this page (the tiling continues).</text>
  <text x="54" y="128" class="noteTxt">Center cell is bold/shaded; its 6 neighbors are the plain outlines. All 7 are the identical circuit, unrotated.</text>

