  <rect x="40" y="760" width="770" height="62" rx="5" class="noteBox"/>
  <text x="54" y="776" class="noteTxt" font-weight="700">Checked, not assumed: 12 shared edges in this 7-cell flower (6 center↔neighbor, 6 neighbor↔neighbor around the</text>
  <text x="54" y="792" class="noteTxt">outer ring) — every one computed to land on the exact same point from both cells, and every one pairs the same</text>
  <text x="54" y="808" class="noteTxt">axis letter with opposite polarity (A+↔A−, B+↔B−, C+↔C−). Zero mismatches, verified by direct computation.</text>

  <!-- Safety -->
