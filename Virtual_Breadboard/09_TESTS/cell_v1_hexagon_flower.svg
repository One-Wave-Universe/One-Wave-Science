  <text x="55" y="846" class="warnTxt" font-weight="700">Each cell's own both-ON and I₀-blind-spot warnings (cell_v1_hexagon_build.svg) still apply, independently,</text>
  <text x="55" y="862" class="warnTxt">to every one of these 7 cells — tiling them together changes nothing about a single cell's own hazards.</text>

  <text x="40" y="906" class="small">One-Wave Science — Virtual_Breadboard/09_TESTS. This is a topology/connection diagram, not a build sheet —</text>
  <text x="40" y="920" class="small">each cell's real circuit is cell_v1_schematic.svg / cell_v1_hexagon_build.svg. Whether adjacent cells' RED/BLACK</text>
  <text x="40" y="934" class="small">rings should electrically fuse into one grid-wide rail, or stay separate per cell, is still an open design choice —</text>
  <text x="40" y="948" class="small">this page only shows that the axis polarity itself lines up automatically; it does not decide that question.</text>

