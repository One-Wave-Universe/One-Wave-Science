  <text x="40" y="38" class="title">CELL_V1 — Six Around One: Every Shared Side Matches + to −</text>
  <text x="40" y="56" class="subtitle">Same identical hexagon cell, translated (never rotated) into all six neighbor positions. No orientation choice</text>
  <text x="40" y="70" class="subtitle">was made or needed — pairing falls straight out of the fixed A/B/C side pattern and hex-tiling geometry alone.</text>

  <!-- Rule box -->
