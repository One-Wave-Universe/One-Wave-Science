<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100" font-family="Helvetica, Arial, sans-serif">
  <style>
    .wire { stroke:#000; stroke-width:2; fill:none; }
    .axisline { stroke:#4b2e83; stroke-width:2.5; fill:none; }
    .dot { fill:#000; }
    .lbl { font-size:14px; fill:#000; }
    .lblB { font-size:14px; fill:#000; font-weight:700; }
    .small { font-size:11px; fill:#333; }
    .rail-red { fill:#b30000; font-weight:700; }
    .rail-black { fill:#000; font-weight:700; }
    .rail-blue { fill:#1a4fa0; font-weight:700; }
    .axisLbl { fill:#4b2e83; font-weight:700; font-size:12.5px; }
    .box { fill:#fff; stroke:#000; stroke-width:2; }
    .title { font-size:21px; font-weight:800; fill:#000; }
    .subtitle { font-size:11.5px; fill:#333; }
    .warn { fill:#fff4f4; stroke:#b30000; stroke-width:2; }
    .warnTxt { fill:#7a0000; font-size:11.5px; }
    .noteBox { fill:#f5f7fb; stroke:#1a4fa0; stroke-width:1.5; }
    .noteTxt { fill:#1a3a66; font-size:11.5px; }
    .endLbl { font-size:11px; fill:#000; text-anchor:middle; }
    .endLblSm { font-size:10px; fill:#444; text-anchor:middle; }
  </style>

  <rect x="16" y="16" width="818" height="1068" fill="none" stroke="#999" stroke-width="1"/>

  <text x="40" y="40" class="title">CELL_V1 — Hexagon Build: Ports on the SIDES, Not the Corners</text>
  <text x="40" y="58" class="subtitle">Corrected again: PA/PB/PC now land on the midpoint of a hexagon SIDE, not a corner. In a hex tiling each side is</text>
  <text x="40" y="72" class="subtitle">shared by exactly ONE neighbor cell; each corner is shared by THREE. A side gives one clean cell-to-cell link —</text>
  <text x="40" y="86" class="subtitle">a corner would leave it ambiguous which of three neighbors (and whose Field/Void) it's actually meeting.</text>

  <!-- Rule box -->
  <rect x="40" y="96" width="770" height="58" rx="5" class="noteBox"/>
  <text x="54" y="112" class="noteTxt" font-weight="700">Still 3 mirrored axis pairs (D-411: −d (0) +d) through the shared STAR/BLUE center — only WHERE each axis</text>
  <text x="54" y="128" class="noteTxt">meets the hexagon boundary changed, from corner to side-midpoint. Same verified circuit as cell_v1_schematic.svg.</text>
  <text x="54" y="144" class="noteTxt">Each side-port is this cell's Field/Void meeting point with the one neighbor cell that shares that side.</text>

  <!-- ============ Hexagon guide outline (corners unchanged, just a reference shape) ============ -->
  <polygon points="430,280 611.9,385 611.9,595 430,700 248.1,595 248.1,385"
           fill="none" stroke="#bbb" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- tick marks at the 6 side midpoints, showing where ports now sit -->
  <circle cx="520.9" cy="332.5" r="3" fill="#bbb"/>
  <circle cx="520.9" cy="647.5" r="3" fill="#bbb"/>
  <circle cx="430.0" cy="700.0" r="0" fill="none"/>
  <circle cx="339.1" cy="647.5" r="3" fill="#bbb"/>
  <circle cx="339.1" cy="332.5" r="3" fill="#bbb"/>
  <circle cx="248.1" cy="490.0" r="3" fill="#bbb"/>
  <circle cx="611.9" cy="490.0" r="3" fill="#bbb"/>

  <!-- ============ 3 axis lines: PA/PB/PC, each one node, side-midpoint to side-midpoint ============ -->
  <line x1="520.9" y1="332.5" x2="339.1" y2="647.5" class="axisline"/>
  <line x1="520.9" y1="647.5" x2="339.1" y2="332.5" class="axisline"/>
  <line x1="248.1" y1="490.0" x2="611.9" y2="490.0" class="axisline"/>

  <!-- ============ RED / BLACK rings ============ -->
  <circle cx="430" cy="490" r="90" fill="none" stroke="#b30000" stroke-width="2.5"/>
  <circle cx="430" cy="490" r="125" fill="none" stroke="#000" stroke-width="2.5"/>

  <!-- ============ Connection dots ============ -->
  <!-- Axis A: + upper-right side, - lower-left side -->
  <circle cx="475.0" cy="412.1" r="4" fill="#b30000" class="dot"/>
  <text x="486" y="408" class="small" fill="#b30000">Q1</text>
  <circle cx="367.5" cy="598.3" r="4" fill="#000" class="dot"/>
  <text x="330" y="612" class="small">Q2</text>

  <!-- Axis B: + lower-right side, - upper-left side -->
  <circle cx="475.0" cy="567.9" r="4" fill="#b30000" class="dot"/>
  <text x="486" y="580" class="small" fill="#b30000">Q3</text>
  <circle cx="367.5" cy="381.7" r="4" fill="#000" class="dot"/>
  <text x="330" y="376" class="small">Q4</text>

  <!-- Axis C: + left side, - right side -->
  <circle cx="340.0" cy="490.0" r="4" fill="#b30000" class="dot"/>
  <text x="340" y="475" class="small" fill="#b30000" text-anchor="middle">Q5</text>
  <circle cx="555.0" cy="490.0" r="4" fill="#000" class="dot"/>
  <text x="555" y="475" class="small" text-anchor="middle">Q6</text>

  <!-- ============ Axis node-name labels ============ -->
  <text x="500" y="500" text-anchor="middle" class="axisLbl">PA</text>
  <text x="500" y="480" text-anchor="middle" class="axisLbl">PB</text>
  <text x="430" y="512" text-anchor="middle" class="axisLbl">PC</text>

  <!-- ============ STAR hub + 3 short 1k stubs ============ -->
  <line x1="450.0" y1="455.4" x2="430" y2="490" class="wire" stroke="#1a4fa0"/>
  <line x1="450.0" y1="524.6" x2="430" y2="490" class="wire" stroke="#1a4fa0"/>
  <line x1="390.0" y1="490.0" x2="430" y2="490" class="wire" stroke="#1a4fa0"/>
  <text x="452" y="448" class="small" fill="#1a4fa0">1kΩ</text>
  <text x="452" y="540" class="small" fill="#1a4fa0">1kΩ</text>
  <text x="388" y="507" class="small" fill="#1a4fa0">1kΩ</text>
  <circle cx="430" cy="490" r="9" fill="#fff" stroke="#1a4fa0" stroke-width="2.5"/>
  <text x="430" y="466" text-anchor="middle" class="rail-blue" font-size="12.5">STAR / BLUE / G</text>

  <!-- ============ Side-port end labels ============ -->
  <text x="545.9" y="279" class="endLbl" font-weight="700">A+ side</text>
  <text x="545.9" y="292" class="endLblSm">PMOS→RED · ≈+12V</text>
  <text x="545.9" y="304" class="endLblSm">→ shares this side with 1 neighbor cell</text>

  <text x="314.1" y="700" class="endLbl" font-weight="700">A− side</text>
  <text x="314.1" y="713" class="endLblSm">NMOS→BLACK · ≈−12V</text>

  <text x="545.9" y="680" class="endLbl" font-weight="700">B+ side</text>
  <text x="545.9" y="693" class="endLblSm">PMOS→RED · ≈+12V</text>

  <text x="314.1" y="279" class="endLbl" font-weight="700">B− side</text>
  <text x="314.1" y="292" class="endLblSm">NMOS→BLACK · ≈−12V</text>

  <text x="198.1" y="480" class="endLbl" font-weight="700">C+ side</text>
  <text x="198.1" y="493" class="endLblSm">PMOS→RED</text>
  <text x="198.1" y="505" class="endLblSm">≈+12V</text>

  <text x="661.9" y="480" class="endLbl" font-weight="700">C− side</text>
  <text x="661.9" y="493" class="endLblSm">NMOS→BLACK</text>
  <text x="661.9" y="505" class="endLblSm">≈−12V</text>

  <!-- ============ Explanation note ============ -->
  <rect x="40" y="762" width="770" height="60" rx="5" class="noteBox"/>
  <text x="54" y="778" class="noteTxt" font-weight="700">Six sides, six ports, three axes — same accounting as before (D-411's 3 pairs → 6 routes → 1 center),</text>
  <text x="54" y="794" class="noteTxt">just relocated from corner to side-midpoint. A dot marks a real connection; every other crossing on this page —</text>
  <text x="54" y="810" class="noteTxt">axis through a ring, axis through another axis near center — has no dot: not connected (same convention as before).</text>

  <!-- Safety -->
  <rect x="40" y="828" width="770" height="66" rx="6" class="warn"/>
  <text x="55" y="846" class="warnTxt" font-weight="700">Both-ON is still illegal on every axis, independently — moving the ports to the sides changes nothing about that.</text>
  <text x="55" y="862" class="warnTxt">Still invisible to I₀ (runs RED ring → Q → that axis's node → Q → BLACK ring, never touches BLUE/STAR) —</text>
  <text x="55" y="878" class="warnTxt">watch heat, smell, or current-limit per axis. Never put a capacitor in either ring or at the hub.</text>

  <!-- I0 readout -->
  <line x1="430" y1="499" x2="430" y2="940" class="wire" stroke="#1a4fa0"/>
  <rect x="412" y="940" width="36" height="20" class="box"/>
  <text x="430" y="954" text-anchor="middle" class="small">1Ω</text>
  <text x="456" y="954" class="lblB">I<tspan baseline-shift="sub" font-size="10">0</tspan> here — ONE meter for the whole hexagon</text>

  <text x="40" y="1012" class="small">One-Wave Science — Virtual_Breadboard/09_TESTS. Build and pass each axis's own receipt (per cell_v1_schematic.svg,</text>
  <text x="40" y="1026" class="small">reading its own PMOS/NMOS end as PA/PB/PC) before tying it into the shared rings and hub. Per-axis circuit is</text>
  <text x="40" y="1040" class="small">verified (test 24). The hexagon arrangement, and putting its ports on the sides for clean cell-to-cell tiling, is a</text>
  <text x="40" y="1054" class="small">mechanical/topological layout — not yet bench-built, and the neighbor-cell Field/Void pairing itself is conceptual here.</text>

</svg>
