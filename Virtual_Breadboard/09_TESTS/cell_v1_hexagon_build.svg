<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100" font-family="Helvetica, Arial, sans-serif">
  <style>
    .wire { stroke:#000; stroke-width:2; fill:none; }
    .axisline { stroke:#4b2e83; stroke-width:2.5; fill:none; }
    .dot { fill:#000; }
    .lbl { font-size:14px; fill:#000; }
    .lblB { font-size:14px; fill:#000; font-weight:700; }
    .small { font-size:11px; fill:#333; }
    .rail-red { fill:#b30000; font-weight:700; }
    .rail-black { fill:#000; font-weight:700; }
    .rail-blue { fill:#1a4fa0; font-weight:700; }
    .axisLbl { fill:#4b2e83; font-weight:700; font-size:12.5px; }
    .box { fill:#fff; stroke:#000; stroke-width:2; }
    .title { font-size:22px; font-weight:800; fill:#000; }
    .subtitle { font-size:11.5px; fill:#333; }
    .warn { fill:#fff4f4; stroke:#b30000; stroke-width:2; }
    .warnTxt { fill:#7a0000; font-size:11.5px; }
    .noteBox { fill:#f5f7fb; stroke:#1a4fa0; stroke-width:1.5; }
    .noteTxt { fill:#1a3a66; font-size:11.5px; }
    .endLbl { font-size:11px; fill:#000; text-anchor:middle; }
    .endLblSm { font-size:10px; fill:#444; text-anchor:middle; }
  </style>

  <rect x="16" y="16" width="818" height="1068" fill="none" stroke="#999" stroke-width="1"/>

  <text x="40" y="42" class="title">CELL_V1 — Hexagon Build: 3 Mirrored Axis Pairs</text>
  <text x="40" y="60" class="subtitle">Corrected again: not 3 stations + 3 empty slots — 3 AXES, each spanning two opposite hexagon vertices through</text>
  <text x="40" y="74" class="subtitle">one shared center. This is D-411's own vocabulary (Mirrored Axis Pairs): one axis = −d (0) +d. Six vertices,</text>
  <text x="40" y="88" class="subtitle">three axes, one center — nothing left over. Electrically identical to cell_v1_schematic.svg.</text>

  <!-- Rule box -->
  <rect x="40" y="98" width="770" height="60" rx="5" class="noteBox"/>
  <text x="54" y="114" class="noteTxt" font-weight="700">Each winding IS one mirrored axis pair: its own +1 / STAY / −1 states are literally D-411's −d (0) +d.</text>
  <text x="54" y="130" class="noteTxt">The "+d" end (PMOS→RED) and "−d" end (NMOS→BLACK) sit at opposite hexagon vertices; the shared "(0)"</text>
  <text x="54" y="146" class="noteTxt">is the STAR/BLUE center every axis taps through its own 1kΩ load — same circuit as the flat sheet, per axis.</text>

  <!-- ============ Hexagon guide outline ============ -->
  <polygon points="430,280 611.9,385 611.9,595 430,700 248.1,595 248.1,385"
           fill="none" stroke="#bbb" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- ============ 3 axis lines, each ONE node (PA/PB/PC), through the shared center ============ -->
  <line x1="430.0" y1="280.0" x2="430.0" y2="700.0" class="axisline"/>
  <line x1="611.9" y1="595.0" x2="248.1" y2="385.0" class="axisline"/>
  <line x1="248.1" y1="595.0" x2="611.9" y2="385.0" class="axisline"/>

  <!-- ============ RED / BLACK rings ============ -->
  <circle cx="430" cy="490" r="100" fill="none" stroke="#b30000" stroke-width="2.5"/>
  <circle cx="430" cy="490" r="140" fill="none" stroke="#000" stroke-width="2.5"/>


  <!-- ============ Connection dots: only where an axis's OWN +end crosses RED, own -end crosses BLACK ============ -->
  <!-- Axis A: + at top (90deg), - at bottom (-90deg) -->
  <circle cx="430.0" cy="390.0" r="4" fill="#b30000" class="dot"/>
  <text x="443" y="394" class="small" fill="#b30000">Q1</text>
  <circle cx="430.0" cy="630.0" r="4" fill="#000" class="dot"/>
  <text x="443" y="634" class="small">Q2</text>

  <!-- Axis B: + at lower-right (-30deg), - at upper-left (150deg) -->
  <circle cx="516.6" cy="540.0" r="4" fill="#b30000" class="dot"/>
  <text x="524" y="533" class="small" fill="#b30000">Q3</text>
  <circle cx="308.8" cy="420.0" r="4" fill="#000" class="dot"/>
  <text x="272" y="416" class="small">Q4</text>

  <!-- Axis C: + at lower-left (-150deg), - at upper-right (30deg) -->
  <circle cx="343.4" cy="540.0" r="4" fill="#b30000" class="dot"/>
  <text x="303" y="533" class="small" fill="#b30000">Q5</text>
  <circle cx="551.2" cy="420.0" r="4" fill="#000" class="dot"/>
  <text x="559" y="416" class="small">Q6</text>

  <!-- ============ Axis node-name labels, mid-way along each line ============ -->
  <text x="430" y="342" text-anchor="middle" class="axisLbl">PA</text>
  <text x="558" y="482" text-anchor="middle" class="axisLbl">PB</text>
  <text x="300" y="482" text-anchor="middle" class="axisLbl">PC</text>

  <!-- ============ STAR hub + 3 short 1k stubs (drawn before hub circle so hub sits on top) ============ -->
  <line x1="430.0" y1="445.0" x2="430" y2="490" class="wire" stroke="#1a4fa0"/>
  <line x1="469.0" y1="512.5" x2="430" y2="490" class="wire" stroke="#1a4fa0"/>
  <line x1="391.0" y1="512.5" x2="430" y2="490" class="wire" stroke="#1a4fa0"/>
  <text x="440" y="462" class="small" fill="#1a4fa0">1kΩ</text>
  <text x="452" y="507" class="small" fill="#1a4fa0">1kΩ</text>
  <text x="378" y="507" class="small" fill="#1a4fa0">1kΩ</text>
  <circle cx="430" cy="490" r="9" fill="#fff" stroke="#1a4fa0" stroke-width="2.5"/>
  <text x="430" y="466" text-anchor="middle" class="rail-blue" font-size="12.5">STAR / BLUE / G</text>

  <!-- ============ End labels at the 6 vertices ============ -->
  <text x="430" y="264" class="endLbl" font-weight="700">A+ end</text>
  <text x="430" y="277" class="endLblSm">PMOS→RED · ≈+12V</text>

  <text x="430" y="716" class="endLbl" font-weight="700">A− end</text>
  <text x="430" y="729" class="endLblSm">NMOS→BLACK · ≈−12V</text>

  <text x="650.8" y="601" class="endLbl" font-weight="700">B+ end</text>
  <text x="650.8" y="614" class="endLblSm">PMOS→RED · ≈+12V</text>

  <text x="209.2" y="369" class="endLbl" font-weight="700">B− end</text>
  <text x="209.2" y="382" class="endLblSm">NMOS→BLACK · ≈−12V</text>

  <text x="209.2" y="601" class="endLbl" font-weight="700">C+ end</text>
  <text x="209.2" y="614" class="endLblSm">PMOS→RED · ≈+12V</text>

  <text x="650.8" y="369" class="endLbl" font-weight="700">C− end</text>
  <text x="650.8" y="382" class="endLblSm">NMOS→BLACK · ≈−12V</text>

  <!-- ============ Explanation note ============ -->
  <rect x="40" y="762" width="770" height="60" rx="5" class="noteBox"/>
  <text x="54" y="778" class="noteTxt" font-weight="700">Each axis (PA/PB/PC) is ONE electrical node end to end — PMOS at one vertex, NMOS at the opposite vertex,</text>
  <text x="54" y="794" class="noteTxt">same coil in between. A dot marks a real connection (Q1 to RED, Q2 to BLACK, etc.); every other crossing on</text>
  <text x="54" y="810" class="noteTxt">this page — axis lines through the rings, axis lines through each other near center — has no dot: not connected.</text>

  <!-- Safety -->
  <rect x="40" y="828" width="770" height="66" rx="6" class="warn"/>
  <text x="55" y="846" class="warnTxt" font-weight="700">Both-ON is still illegal on every axis, independently — the hexagon layout changes nothing about that.</text>
  <text x="55" y="862" class="warnTxt">Still invisible to I₀ (runs RED ring → Q → that axis's node → Q → BLACK ring, never touches BLUE/STAR) —</text>
  <text x="55" y="878" class="warnTxt">watch heat, smell, or current-limit per axis. Never put a capacitor in either ring or at the hub.</text>

  <!-- I0 readout -->
  <line x1="430" y1="499" x2="430" y2="940" class="wire" stroke="#1a4fa0"/>
  <rect x="412" y="940" width="36" height="20" class="box"/>
  <text x="430" y="954" text-anchor="middle" class="small">1Ω</text>
  <text x="456" y="954" class="lblB">I<tspan baseline-shift="sub" font-size="10">0</tspan> here — ONE meter for the whole hexagon</text>

  <text x="40" y="1012" class="small">One-Wave Science — Virtual_Breadboard/09_TESTS. Build and pass each axis's own receipt (per cell_v1_schematic.svg,</text>
  <text x="40" y="1026" class="small">reading its own PMOS/NMOS end as PA/PB/PC) before tying it into the shared rings and hub. Per-axis circuit is</text>
  <text x="40" y="1040" class="small">verified (test 24); this hexagon/mirrored-axis arrangement is a mechanical layout, not yet bench-confirmed as a whole.</text>

</svg>
